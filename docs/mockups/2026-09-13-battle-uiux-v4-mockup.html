<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>戦闘 UI / UX v4 モックアップ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Shippori+Mincho:wght@500;700&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  /* ============================================================
     page chrome (outside the 1920x1080 stage)
     ============================================================ */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: #17181a; color: #cfd2d6;
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    font-size: 14px; line-height: 1.6; padding-block: 10px 40px; padding-inline: 16px;
  }
  .page { max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .tabs, .subbar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; background: #202226; border: 1px solid #2c2f34; border-radius: 4px; padding: 6px 10px; }
  .tabs button, .subbar button {
    font: inherit; font-size: 13px; color: #cfd2d6; background: #2a2d32; border: 1px solid #383c42; padding: 4px 10px; border-radius: 3px; cursor: pointer;
  }
  .tabs button[aria-selected="true"], .subbar button[aria-pressed="true"] { background: #3d4a55; border-color: #6a8898; color: #fff; }
  .subbar button.run { background: #2e4a3f; border-color: #4a7a66; }
  .subbar button:disabled { opacity: .45; cursor: default; }
  .subbar .lbl { font-size: 12px; letter-spacing: .08em; color: #8f949b; margin-right: 2px; }
  .subbar .sep { width: 1px; height: 18px; background: #383c42; margin-inline: 4px; }
  .subbar .hint { font-size: 12px; color: #8f949b; margin-left: auto; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }
  .stepbar { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; font-size: 13px; color: #9aa0a8; background: #202226; border: 1px solid #2c2f34; border-radius: 4px; padding: 6px 12px; min-height: 32px; }
  .stepbar b { color: #e6e9ec; font-weight: 500; }
  .stepbar .tl { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 4px; }
  .stepbar .tl span { opacity: .45; }
  .stepbar .tl span.done { opacity: .8; }
  .stepbar .tl span.now { opacity: 1; color: #63e0c9; }
  .caption { font-size: 12.5px; color: #8f949b; max-width: 1100px; margin: 0; }
  .frame { position: relative; width: min(100%, 1600px); aspect-ratio: 16 / 9; margin: 0 auto; overflow: hidden; border: 1px solid #2c2f34; background: #0e1c26; }

  /* ============================================================
     stage: fixed 1920x1080, scaled by --s (JS)
     ============================================================ */
  .stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; transform: scale(var(--s, 1));
    overflow: hidden; user-select: none; color: var(--ink); background: var(--ground);
    font-family: var(--f-body); font-size: 16px; line-height: 1.35;
    /* ---- A+ tokens (battle_ui_ux_v2 §4.5 / §4.8) ---- */
    --ground: #0e1c26; --panel: rgba(16,32,42,.84); --ink: #eef3f0; --muted: #a3b5b3; --line: rgba(190,215,210,.16);
    --accent: #63e0c9; --warm: #ffc46b; --omen: #ff5d47; --guard: #9cc7ff; --whiff: #7d8a8c; --amber: #f0a848;
    --paper: #f0e6d0; --paper-ink: #2b2620; --paper-line: rgba(43,38,32,.35); --flood: #06090c;
    --attack: #ff5d47; --guard-attr: #9cc7ff; --stance: #ffc46b; --skill: #63e0c9; --move: #eef3f0;
    --status-foe: #ff5d47; --status-self: #63e0c9; --boss: #a97cf2;
    --fig-p: #2b4a53; --fig-e: #4d2624; --glow: rgba(255,196,107,.5);
    --f-disp: "Shippori Mincho", "Hiragino Mincho ProN", serif; --f-body: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif; --f-mono: "IBM Plex Mono", monospace;
    --radius: 6px; --shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  .stage .num, .stage .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  .stage .disp { font-family: var(--f-disp); }
  .stage s { text-decoration-color: var(--muted); }
  .stage .dim { color: var(--muted); }
  .stage .warn { color: var(--amber); }
  .stage .panel { background: var(--panel); backdrop-filter: blur(6px); border-radius: var(--radius); }
  .stage .btn { font: inherit; font-size: 16px; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 6px 14px; border-radius: var(--radius); cursor: pointer; letter-spacing: .04em; }
  .stage .btn:hover { border-color: var(--accent); }
  .stage .btn.primary { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .stage .btn:disabled { opacity: .4; cursor: default; }
  .stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 14; background: radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.32) 100%); }
  .stage.locked .hand, .stage.locked .endturn { pointer-events: none; }
  .stage.locked .hand .card { filter: brightness(.6); }

  /* floors (§4.3) */
  .stage[data-floor="1"] { --arena-top: #1d3340; --arena-bot: #0f1a22; --fog: rgba(255,255,255,.05); }
  .stage[data-floor="2"] { --arena-top: #1c2a3d; --arena-bot: #0d141e; --fog: rgba(220,220,255,.06); }
  .stage[data-floor="3"] { --arena-top: #1a1f3a; --arena-bot: #0b0d1a; --fog: rgba(150,120,220,.10); }
  .stage[data-floor="4"] { --arena-top: #1a1626; --arena-bot: #090810; --fog: rgba(190,80,130,.12); }
  .stage[data-floor="5"] { --arena-top: #1a0e12; --arena-bot: #070507; --fog: rgba(190,40,40,.14); }

  /* ---- top band 0-76 ---- */
  .top { position: absolute; left: 0; top: 0; width: 1920px; height: 76px; border-bottom: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(6px); z-index: 6; }
  .top .tl { position: absolute; left: 38px; width: 692px; top: 0; height: 76px; display: flex; align-items: center; gap: 24px; font-size: 14px; color: var(--muted); }
  .top .tm { position: absolute; left: 730px; width: 537px; top: 0; height: 76px; display: flex; align-items: center; justify-content: center; font-size: 18px; letter-spacing: .06em; font-family: var(--f-disp); }
  .top .tm .sep { color: var(--muted); margin-inline: 10px; }
  .top .tm .whose { color: var(--accent); }
  .top .tm .whose.enemy { color: var(--omen); }
  .top .tr { position: absolute; left: 1267px; width: 615px; top: 0; height: 76px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; }
  .top .ename { font-family: var(--f-disp); font-size: 18px; }
  .top .tag { display: inline-block; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin-left: 6px; vertical-align: middle; }
  .top .tag.boss { color: var(--boss); border-color: var(--boss); }
  .meter { display: inline-flex; align-items: center; gap: 8px; }
  .meter .cells { display: inline-flex; gap: 2px; }
  .meter .cells i { display: block; width: 10px; height: 14px; background: var(--line); }
  .meter .cells i.on { background: var(--muted); }
  .meter.miasma .cells i.on { background: var(--omen); opacity: .85; }
  .meter .num { color: var(--ink); }
  .adapt-mark { display: inline-block; width: 12px; height: 12px; background: var(--boss); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); vertical-align: middle; margin-left: 6px; }
  .adapt-mark.turtle { clip-path: polygon(0 100%, 50% 0, 100% 100%); }
  .adapt-mark.closer { clip-path: polygon(0 0, 100% 50%, 0 100%); }

  /* ---- arena 76-626 ---- */
  .arena { position: absolute; left: 0; top: 76px; width: 1920px; height: 550px; overflow: hidden; background: radial-gradient(ellipse 70% 55% at 50% 85%, var(--fog), transparent 70%), linear-gradient(var(--arena-top), var(--arena-bot)); }
  .arena::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 14%; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,.35), transparent 80%), repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 17px, transparent 17px 40px), repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 4px, transparent 4px 18px); }
  .mist { position: absolute; inset: 0; pointer-events: none; }
  .mist.back { background: radial-gradient(ellipse 30% 40% at 20% 70%, var(--fog), transparent 70%), radial-gradient(ellipse 40% 35% at 70% 80%, var(--fog), transparent 70%); background-size: 1920px 100%; animation: mist-drift 60s linear infinite; }
  .mist.front { background: radial-gradient(ellipse 25% 30% at 45% 88%, var(--fog), transparent 70%), radial-gradient(ellipse 35% 25% at 90% 92%, var(--fog), transparent 70%); background-size: 1920px 100%; animation: mist-drift 28s linear infinite reverse; z-index: 4; }
  @keyframes mist-drift { from { background-position: 0 0; } to { background-position: 1920px 0; } }
  .embers { position: absolute; inset: 0; pointer-events: none; display: none; overflow: hidden; }
  .stage[data-floor="5"] .embers { display: block; }
  .embers i { position: absolute; bottom: -2%; width: 6px; height: 6px; border-radius: 50%; background: color-mix(in srgb, var(--omen) 75%, var(--warm)); box-shadow: 0 0 10px color-mix(in srgb, var(--omen) 60%, transparent); opacity: 0; animation: ember linear infinite; }
  @keyframes ember { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: .9; } 50% { transform: translate(28px, -45vh); } 100% { transform: translate(-20px, -95vh); opacity: 0; } }
  .floorline { position: absolute; left: 0; right: 0; top: 505px; height: 4px; background: rgba(160,190,185,.34); box-shadow: 0 -1px 0 color-mix(in srgb, var(--warm) 40%, transparent), 0 3px 12px rgba(0,0,0,.4); z-index: 2; }

  /* invest bands (§2.1: 塗り 32-52%, 各 54px, 人型の後ろ α .3) */
  .bands { position: absolute; left: 0; top: 270px; width: 1920px; height: 216px; z-index: 1; display: none; }
  .bands.show { display: block; animation: fade-in 150ms ease-out; }
  @keyframes fade-in { from { opacity: 0; } }
  .band { position: absolute; left: 0; width: 1920px; height: 54px; background: color-mix(in srgb, var(--panel) 36%, transparent); border-top: 1px solid var(--line); }
  .band.hover { background: color-mix(in srgb, var(--panel) 60%, transparent); border-top-color: color-mix(in srgb, var(--ink) 55%, transparent); }
  .band.def { box-shadow: inset 0 0 0 1px var(--accent); }
  .band.hatch { background-image: repeating-linear-gradient(45deg, transparent 0 10px, color-mix(in srgb, var(--whiff) 35%, transparent) 10px 12px); }
  .band .ll, .band .rl { position: absolute; top: 0; height: 54px; display: flex; align-items: center; font-size: 16px; white-space: nowrap; }
  .band .ll { left: 38px; width: 420px; color: var(--ink); }
  .band .rl { left: 1651px; width: 230px; justify-content: flex-end; color: var(--ink); }
  .band.hatch .ll, .band.hatch .rl { color: var(--muted); }
  .band .ll .t { color: var(--accent); margin-right: 8px; }
  .band .ll .dot { color: var(--muted); margin-inline: 6px; }
  .band .deftag { margin-left: 14px; font-size: 12px; color: var(--accent); letter-spacing: .1em; }
  .band .reason { position: absolute; left: 280px; top: 18px; font-size: 12px; color: var(--whiff); letter-spacing: .1em; }
  .band .split { position: absolute; top: 0; height: 54px; width: 1px; background: color-mix(in srgb, var(--ink) 35%, transparent); }
  .band .split span { position: absolute; top: 18px; font-size: 12px; color: var(--muted); letter-spacing: .1em; white-space: nowrap; }
  .band .split span.l { right: 96px; } .band .split span.r { left: 96px; }
  .band .split span.on { color: var(--accent); }

  /* target bands (§2.1: 下 54% h14 / 上 52.4% h10, 幅 173) */
  .tbands { position: absolute; inset: 0; pointer-events: none; z-index: 3; }
  .tband { position: absolute; width: 173px; transform: translateX(-50%); transition: left 320ms ease-in-out, opacity 300ms; }
  .tband.lower { top: 500px; height: 14px; }
  .tband.upper { top: 485px; height: 10px; }
  .tband.t2 { opacity: .45; }
  .tband.hit { background: var(--omen); box-shadow: 0 0 18px color-mix(in srgb, var(--omen) 60%, transparent); }
  .tband.half { background: color-mix(in srgb, var(--amber) 80%, transparent); }
  .tband.whiff { background: transparent; border: 2px dashed var(--whiff); }
  .tband.skill { background: transparent; border: 2px dotted var(--omen); }
  .tband.skill.whiff { border-color: var(--whiff); }
  .tband .tag { position: absolute; right: 100%; top: 50%; transform: translateY(-50%); margin-right: 6px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; line-height: 16px; background: var(--ground); }
  .tband .txt { position: absolute; left: 100%; top: 50%; transform: translateY(-50%); margin-left: 8px; font-size: 14px; white-space: nowrap; color: var(--muted); }
  .tband .txt b { font-family: var(--f-mono); font-weight: 500; }
  .tband.hit .txt b { color: var(--omen); } .tband.half .txt b { color: var(--amber); } .tband.whiff .txt b { color: var(--whiff); }
  .dist-label, .field-label, .exile-note { position: absolute; top: 520px; height: 18px; line-height: 18px; transform: translateX(-50%); font-size: 14px; letter-spacing: .12em; color: var(--muted); white-space: nowrap; z-index: 5; }
  .dist-label b { color: var(--ink); font-family: var(--f-disp); font-size: 18px; font-weight: 700; margin-left: 6px; }
  .field-label { color: var(--accent); display: none; }
  .field-label.show { display: block; }
  .exile-note { left: 960px; color: var(--muted); display: none; }
  .exile-note.show { display: block; }
  .stage.dragging .dist-label { visibility: hidden; }

  /* figures (人型 26-54%, 足は床線 507 local) */
  .figw { position: absolute; top: 205px; width: 150px; height: 300px; transform: translateX(-50%); transition: left 320ms ease-in-out, opacity 300ms; z-index: 3; --rot: 0deg; --sy: 1; --dir: 1; --sc: 1; }
  .figw.enemy { --dir: -1; }
  .figw[data-posture="0"] { --rot: -12deg; --sy: 1.08; }
  .figw[data-posture="2"] { --rot: 8deg; --sy: .94; }
  .figw.back { --sc: .9; top: 205px; margin-top: -16px; z-index: 2; }
  .figw .glow { position: absolute; left: 50%; bottom: -14px; width: 280px; height: 34px; transform: translateX(-50%); background: radial-gradient(ellipse at center, var(--glow), transparent 70%); pointer-events: none; animation: lantern 1.8s ease-in-out infinite; transition: background 100ms; }
  .figw.field .glow { background: radial-gradient(ellipse at center, color-mix(in srgb, var(--accent) 55%, transparent), transparent 70%); }
  @keyframes lantern { 0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; } 50% { transform: translateX(-50%) scale(1.06); opacity: .88; } }
  .figw .fig { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; transform-origin: 50% 100%; transform: scaleX(var(--dir)) rotate(var(--rot)) scaleY(var(--sy)) scale(var(--sc)); transition: transform 200ms ease-in-out; color: var(--fig-p); fill: currentColor; stroke: currentColor; filter: drop-shadow(0 0 1px var(--warm)) drop-shadow(0 4px 8px rgba(0,0,0,.5)); }
  .figw.enemy .fig { color: var(--fig-e); }
  .figw .fig .weapon { stroke: var(--muted); fill: none; stroke-linecap: round; }
  .figw.ghost { opacity: 0; pointer-events: none; transition: opacity 200ms, left 200ms; z-index: 2; }
  .figw.ghost.show { opacity: .35; }
  .figw.ghost .glow { display: none; }
  .figw .glabel { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 16px; font-size: 14px; color: var(--muted); white-space: nowrap; }
  .figw.down { opacity: .25; }
  .figw.down .glow { display: none; }
  .figw .stance-glow { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 300ms; }
  .figw .stance-glow svg { width: 100%; height: 100%; overflow: visible; color: var(--stance); fill: currentColor; opacity: .25; filter: blur(6px); transform-origin: 50% 100%; transform: scaleX(var(--dir)) rotate(var(--rot)) scaleY(var(--sy)) scale(var(--sc)); }
  .figw.stanced .stance-glow { opacity: 1; }
  .figw .ring { position: absolute; left: 50%; top: 40%; width: 120px; height: 200px; transform: translate(-50%, -30%); border: 4px solid var(--guard); border-radius: 50%; opacity: 0; pointer-events: none; box-shadow: 0 0 20px var(--guard); }
  .figw .foot-dist { position: absolute; left: 50%; top: 100%; margin-top: 12px; transform: translateX(-50%); font-size: 14px; color: var(--muted); letter-spacing: .1em; white-space: nowrap; }
  .figw .foot-dist b { color: var(--ink); font-family: var(--f-disp); font-size: 16px; margin-left: 4px; }
  .flash { position: absolute; inset: 0; background: var(--omen); opacity: 0; pointer-events: none; mix-blend-mode: screen; z-index: 6; }
  .float { position: absolute; transform: translateX(-50%); font-family: var(--f-mono); font-weight: 600; font-size: 24px; pointer-events: none; white-space: nowrap; text-shadow: 0 3px 10px rgba(0,0,0,.6); z-index: 8; }
  .float.dmg { color: var(--omen); font-family: var(--f-disp); font-weight: 700; font-size: 40px; -webkit-text-stroke: 1px rgba(0,0,0,.65); paint-order: stroke fill; }
  .float.gray { color: var(--whiff); font-size: 18px; font-weight: 500; }
  .float.good { color: var(--guard); font-size: 24px; }
  .float.warm { color: var(--warm); font-size: 24px; }
  .float.acc { color: var(--accent); font-size: 20px; }
  .float small { font-size: 12px; font-family: var(--f-body); font-weight: 400; margin-left: 6px; vertical-align: middle; -webkit-text-stroke: 0; }
  .fx { position: absolute; pointer-events: none; z-index: 7; }
  .fx.slash { width: 220px; height: 220px; border-radius: 50%; border: 6px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent); transform: translate(-50%, -50%) rotate(-30deg); opacity: 0; }
  .fx.pierce { width: 260px; height: 4px; background: linear-gradient(90deg, transparent, var(--accent), #fff); transform: translate(-50%, -50%); opacity: 0; }
  .fx.sweep { width: 360px; height: 44px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--omen) 70%, transparent), transparent); transform: translate(-50%, -50%); opacity: 0; border-radius: 50%; }
  .fx.seal { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--omen); transform: translate(-50%, -50%); opacity: 0; }
  .fx.seal.self { border-color: var(--accent); }
  .darken { position: absolute; inset: 0; pointer-events: none; z-index: 13; box-shadow: inset 0 0 120px rgba(0,0,0,.9); opacity: 0; }

  /* omen lane 86-227 (stage coords) */
  .lane { position: absolute; left: 0; top: 86px; width: 1920px; height: 141px; z-index: 5; pointer-events: none; }
  .lane svg.links { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .omen { position: absolute; bottom: 10px; transform: translateX(-50%); width: 440px; transition: left 200ms ease-out; }
  .omen.narrow { width: 240px; }
  .omen.narrow .t1 { font-size: 13px; padding: 0 10px; gap: 6px; }
  .omen.narrow .t1 .k { display: none; }
  .omen.narrow .t2 { font-size: 12px; padding: 0 8px; }
  .omen .t1 { position: relative; height: 64px; padding: 0 16px; display: flex; align-items: center; gap: 10px; white-space: nowrap; font-size: 16px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--omen) 30%, var(--panel)), var(--panel) 40%); box-shadow: inset 0 0 0 2px rgba(0,0,0,.65), var(--shadow);
    clip-path: polygon(1.5% 0, 97% 0, 100% 14%, 98.5% 36%, 100% 58%, 97.5% 74%, 100% 100%, 0 100%, 0 60%, 2% 38%, 0 18%); }
  .omen.boss .t1 { box-shadow: inset 0 0 0 4px var(--boss), var(--shadow); }
  .omen .t1 .k { color: var(--omen); font-family: var(--f-disp); font-weight: 700; }
  .omen .t1 .txt { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .omen .t2 .txt { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .omen .t2 .plan { flex: 0 0 auto; }
  .omen.struck .t1 .txt { text-decoration: line-through; color: var(--muted); }
  .omen .t1 .after { color: var(--whiff); font-size: 14px; display: none; }
  .omen.struck .t1 .after { display: inline; }
  .omen .t1 .cue { margin-left: auto; font-size: 14px; color: var(--accent); }
  .omen .t1 .note { position: absolute; right: 16px; bottom: 2px; font-size: 12px; color: var(--muted); }
  .omen .t1 .amark { flex: 0 0 12px; height: 12px; background: var(--boss); clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .omen .t1 .amark.turtle { clip-path: polygon(0 100%, 50% 0, 100% 100%); }
  .omen .t1 .amark.closer { clip-path: polygon(0 0, 100% 50%, 0 100%); }
  .omen .icons { display: inline-flex; gap: 2px; }
  .omen .icons svg { width: 22px; height: 22px; fill: none; stroke: var(--omen); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .omen .ptr { position: absolute; left: 50%; top: 100%; width: 2px; height: var(--ptr, 30px); background: var(--omen); transform: translateX(-50%); }
  .omen .ptr::after { content: ""; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); border-left: 7px solid transparent; border-right: 7px solid transparent; border-top: 10px solid var(--omen); }

  const half = (n - 1) / 2;
  cards.forEach((el, i) => {
    const k = i - half;
    const x = 960 + k * 230 * (1 - ov) - 115;
    const y = 821 + k * k * 6;
    const a = half ? k * (amax / half) : 0;
    el.style.left = x + "px";
    el.style.top = y + "px";
    let rot = a,
      dx = 0;
    if (hoverIdx >= 0) {
      if (i === hoverIdx) rot += cursorX > x + 115 ? 4 : -4;
      else if (i === hoverIdx - 1) dx = -14;
      else if (i === hoverIdx + 1) dx = 14;
    }
    el.style.setProperty("--rot", rot + "deg");

    : "ターン終了";
}
function renderReserve(remain) {

    r >= 3

  if (P().sta === 0 && S.hand.every((h) => CARDS[h.id].min > 0))
    el.innerHTML += '<span class="no">出せる札がありません</span>';
}
const addLog = (t, cls) => {

// =====================================================================
// 4. preview (確定値。乱数なし) / trait lamps / bands / drag layer
// =====================================================================
function traitState(card, t, targetIdx) {
  const tr = card.trait;
  if (!tr) return "none";
  const p = P();
  const alive = S.enemies.filter((e) => !e.down);
  const needT = ["position", "omen", "broken", "foeStatus"].includes(tr.cc);
  let tgt = targetIdx != null ? S.enemies[targetIdx] : null;
  if (!tgt && needT) {
    if (alive.length === 1 || !needsTarget(card, t)) tgt = nearest();
    else return "hollow";
  }
  switch (tr.cc) {
    case "linked":
      return S.played[tr.param] > 0 ? "lit" : "unlit";
    case "first":
      return S.playedCount === 0 ? "lit" : "unlit";
    case "close":
      return S.playedCount >= 2 ? "lit" : "unlit";
    case "chain":
      return S.lastAttrs && S.lastAttrs.some((a) => card.attrs.includes(a))
        ? "lit"
        : "unlit";
    case "thin":
      return S.hand.length - 1 <= 1 ? "lit" : "unlit";
    case "lastStand":
      return p.sta <= 2 ? "lit" : "unlit";
    case "reserve":
      return p.sta - payOf(card, t, false) >= tr.n ? "lit" : "unlit";
    case "selfStatus":
      return hasStatus(p, tr.param) ? "lit" : "unlit";
    case "position":
      return tgt.dist === tr.param ? "lit" : "unlit";
    case "omen":
      return omenKind(tgt) === tr.param ? "lit" : "unlit";
    case "broken":
      return tgt.sta < 3 ? "lit" : "unlit";
    case "foeStatus":
      return hasStatus(tgt, tr.param) ? "lit" : "unlit";
  }
  return "unlit";
}
function payOf(card, t, heavy) {
  let pay = t;
  if (
    card.trait &&
    card.trait.kind === "invest" &&
    t > 0 &&
    traitState(card, t, null) === "lit"
  )
    pay -= 1;
  if (heavy) pay += 1;
  return pay;
}
// 面の向き: 相手向きの面（アタック面、相手に状態を付けるスキル面）が 1 つでもあれば矢印
function needsTarget(card, t) {
  const fa = card.faces.A && card.faces.A[t];
  const fs = card.faces.Sk && card.faces.Sk[t];
  return !!(fa || (fs && fs.foe && fs.foe.length));
}
function resolveShift(f, dir) {
  if (!f) return 0;
  if (f.choose) return (dir || -1) * Math.abs(f.shift);
  return f.shift;
}

// req = {idx, tier, target(enemy idx|null), dir(+1 退き / −1 詰め), heavy}
function preview(req) {
  const card = CARDS[S.hand[req.idx].id];
  const t = req.tier;
  const p = P();
  const firstFace = card.faces[card.attrs[0]][t];
  const tgtIdx =
    req.target != null
      ? req.target
      : S.enemies.filter((e) => !e.down).length === 1
        ? S.enemies.findIndex((e) => !e.down)
        : null;
  const tgt = tgtIdx != null ? S.enemies[tgtIdx] : null;
  const ts = traitState(card, t, tgtIdx);
  const tr = card.trait;
  const lit = ts === "lit";
  const heavy = req.heavy && tr && tr.kind === "heavy" && lit;
  const pay = payOf(card, t, heavy);
  const remain = p.sta - pay;
  const needT = needsTarget(card, t);
  const noTarget = needT && !tgt && S.enemies.filter((e) => !e.down).length > 1;
  const extra = [];
  const faceStrs = [];
  const rlab = [];
  const refDist = tgt ? tgt.dist : nearest().dist;
  const mf = card.faces.M && card.faces.M[t];
  let shift = mf ? resolveShift(mf, req.dir) : 0;
  if (p.curse || p.slow) shift = 0;
  const distAfter = clamp(refDist + shift, 0, 2);
  const ghostDists = S.enemies.map((e) => clamp(e.dist + shift, 0, 2));
  let power = null,
    brk = 0,
    guardVal = null,
    moved = false;
  for (const a of ORDER(card)) {
    const f = card.faces[a][t];
    if (!f) continue;
    if (a === "A") {
      const d = card.moveFirst ? distAfter : refDist;
      const diff = Math.abs(d - card.range);
      let base = f.p;
      const ex = [];
      if (lit && tr.kind === "power") {
        base += tr.n;
        ex.push(`+${tr.n} ${tr.cond}`);
      }
      if (heavy) {
        base += 6;
        ex.push("+6 重撃");
      }
      if (p.followUp) {
        base += 5;
        ex.push("+5 追撃");
      }
      if (tgt && hasStatus(tgt, "脆化")) {
        ex.push("×1.5 脆化");
      }
      const raw = roundAway(
        base * (tgt && hasStatus(tgt, "脆化") ? 1.5 : 1) * MULT[diff],
      );
      power = raw;
      let s = noTarget ? "威力 —" : `威力 <span class="num">${raw}</span>`;
      if (ex.length && !noTarget)
        s += `<span class="dim">（${f.p} ${ex.join(" ")}）</span>`;
      if (diff && !noTarget)
        s += ` <span class="${diff === 2 ? "dim" : "warn"}">${MULTL[diff]}</span>`;
      if (f.brk) {
        brk = diff === 0 ? f.brk : 0;
        s += diff === 0 ? ` + 崩し ${f.brk}` : ` + <s>崩し ${f.brk}</s>`;
      }
      if (card.moveFirst && mf)
        s += ` <span class="dim">（移動後 ${R[distAfter]}）</span>`;
      faceStrs.push(s);
      rlab.push(
        noTarget
          ? "威力 —"
          : `威力 ${raw}${diff ? " " + MULTL[diff] : ""}${f.brk && diff === 0 ? " + 崩し " + f.brk : ""}`,
      );
    } else if (a === "M") {
      if (p.curse) {
        faceStrs.push(
          '<s>移動</s> <span style="color:var(--boss)">呪縛</span>',
        );
        rlab.push("移動 —（呪縛）");
      } else if (p.slow) {
        faceStrs.push("移動 0（鈍足）");
        rlab.push("移動 0（鈍足）");
      } else if (shift === 0 && mf.choose && !req.dir) {
        faceStrs.push("向きを選ぶ（帯の左 = 退き / 右 = 詰め）");
        rlab.push("向き —");
      } else {
        moved = distAfter !== refDist;
        const dirTxt = shift < 0 ? "詰め" : "退き";
        faceStrs.push(
          `${dirTxt} ${Math.abs(shift)} <span class="dim">${moved ? `${R[refDist]} → ${R[distAfter]}` : "（端）"}</span>`,
        );
        rlab.push(`${dirTxt} ${Math.abs(shift)}${moved ? "" : "（端）"}`);
      }
    } else if (a === "G") {
      let g = f.g;
      const ex = [];
      if (lit && tr.kind === "guard") {
        g += tr.n2 || tr.n;
        ex.push(`+${tr.n2 || tr.n} ${tr.cond}`);
      }
      guardVal = g;
      faceStrs.push(
        `Guard <span class="num">${g}</span>${ex.length ? `<span class="dim">（${f.g} ${ex.join(" ")}）</span>` : ""}`,
      );
      rlab.push(`Guard ${g}`);
    } else if (a === "Sk") {
      const parts = [];
      if (f.draw) {
        const room = 8 - (S.hand.length - 1);
        const n = Math.min(f.draw, room);
        parts.push(
          n < f.draw
            ? `ドロー ${f.draw} → ${n}<span class="dim">（上限 8）</span>`
            : `ドロー ${f.draw}`,
        );
      }
      if (f.heal) parts.push(`HP +${f.heal}`);
      (f.foe || []).forEach((w) => {
        const word = Array.isArray(w) ? `${w[0]} ${w[1]}` : w;
        const diff = tgt ? Math.abs(refDist - card.range) : 0;
        const full =
          tgt &&
          tgt.statuses.length >= 4 &&
          !hasStatus(tgt, Array.isArray(w) ? w[0] : w);
        parts.push(
          noTarget
            ? `${word} —`
            : diff
              ? `<s>${word}</s><span class="dim"> ×1.0 のときだけ</span>`
              : full
                ? `<s>${word}</s><span class="dim"> 上限 4 で付かない</span>`
                : word,
        );
      });
      (f.self || []).forEach((w) => parts.push(w));
      faceStrs.push(parts.join(" + "));
      rlab.push(
        f.foe && f.foe.length
          ? Array.isArray(f.foe[0])
            ? f.foe[0][0]
            : f.foe[0]
          : f.draw
            ? `ドロー ${f.draw}`
            : "スキル",
      );
    } else if (a === "St") {
      faceStrs.push(f.stance);
      rlab.push(f.short);
      if (p.stance) {
        if (p.stance.id === card.name)
          extra.push({ t: `置き直し: ${card.name} T${p.stance.tier} → T${t}${t < p.stance.tier ? "（今より弱い段）" : t === p.stance.tier ? "（同じ段）" : ""}`,
            cls: t <= p.stance.tier ? "warn" : "",
          });
        else {
          extra.push({ t: `置き換え: ${p.stance.name} T${p.stance.tier} → ${card.name} T${t}`,
          });
          extra.push({ t: `<span class="dim">${p.stance.short} → </span>${f.short}`,
          });
        }
      }
    }
  }
  const rows = faceStrs.map((s) => ({ t: s })).concat(extra);
  const payTxt =
    tr && tr.kind === "invest" && lit && t > 0
      ? `<s>${t}</s> ${pay}`
      : `${pay}`;
  rows.push({
    t: `払う <span class="num">${payTxt}</span>${heavy ? "（重撃 +1）" : ""} → 残 <span class="num">${remain}</span>`,
    cls: remain < 0 ? "warn" : "",
  });
  rows.push({
    t: remain >= 3 ? "構え ○（残 3 以上で Guard +3）" : "構え ×（残 3 未満）",
    cls: remain >= 3 ? "" : "warn",
  });
  if (tr)
    rows.push({
      t: `特性 ${ts === "lit" ? "●" : ts === "hollow" ? "◌" : "○"} ${tr.cond}: ${tr.eff}${ts === "hollow" ? "（相手で決まる）" : ""}`,
      cls: lit ? "cue" : "dim",
    });
  if (mf && !p.curse && !p.slow && shift)
    rows.push({
      t: `移動先 ${R[distAfter]}${tgt && tgt.omens[0] && actOf(tgt.omens[0]).range != null ? `（予兆 ${MULTL[Math.abs(distAfter - actOf(tgt.omens[0]).range)]}）` : ""}`,
    });
  rows.push({
    t: needT ? (tgt ? `相手: ${tgt.tag}` : "相手を選ぶ →") : "場（自分と全体）",
    cls: needT && !tgt ? "warn" : "",
    k: "target",
  });
  if (tr && tr.kind === "heavy")
    rows.push({
      t: lit
        ? heavy
          ? "重撃 ○ 払う +1 → 威力 +6"
          : "重撃 可（Shift / 右クリック）"
        : `重撃 —（条件: ${tr.cond} 未達）`,
      cls: lit ? "" : "dim",
      k: "heavy",
    });
  // §5.9 順 1: 条件名（TraitCue）は 9 行の優先順の末尾（§3.1）
  if (req.cue) rows.push({ t: req.cue, cls: "cue" });
  // §3.1: 9 行を超えるときは 重撃 → 相手 の順に退け、それでも超える行は詳細ポップへ
  let shown = rows;
  for (const k of ["heavy", "target"])
    if (shown.length > 9) shown = shown.filter((r) => r.k !== k);
  shown = shown.slice(0, 9);
  const reason = !firstFace
    ? "—"
    : pay > p.sta
      ? "スタミナ不足"
      : p.intimidated && t === 3
        ? "威圧 −1"
        : null;
  const payable =
    !reason &&
    !noTarget &&
    !(P().curse && card.attrs.length === 1 && card.attrs[0] === "M");
  return {
    card,
    tier: t,
    rows: shown,
    pay,
    remain,
    payable,
    reason,
    ts,
    lit,
    heavy,
    needT,
    noTarget,
    tgtIdx,
    distAfter,
    ghostDists,
    shift,
    power,
    brk,
    guardVal,
    moved,
    rlabel: noTarget ? "相手を選ぶ →" : rlab.join(" ／ "),
    payTxt,
  };
}

// ---- invest bands ----
function renderBands() {
  const b = S.variant === "a" ? $("bandsA") : $("bands");
  $(S.variant === "a" ? "bands" : "bandsA").classList.remove("show");
  const ctx =
    S.drag ||
    (S.sel >= 0
      ? {
          idx: S.sel,
          tier: S.hoverTier,
          target: S.selTarget,
          dir: S.selDir,
          heavy: S.selHeavy,
          sel: true,
        }
      : S.showBands
        ? {
            idx: S.staticIdx || 0,
            tier: -1,
            target: S.enemies.length === 1 ? 0 : null,
          }
        : null);
  if (!ctx || S.hand[ctx.idx] == null) {
    b.classList.remove("show");
    b.innerHTML = "";
    return;
  }
  const card = CARDS[S.hand[ctx.idx].id];
  const def = defaultTier(card);
  let h = '<span class="fieldtab">場</span>';
  for (let t = 3; t >= 0; t--) {
    const pv = preview({
      idx: ctx.idx,
      tier: t,
      target: ctx.target,
      dir: ctx.dir,
      heavy: ctx.heavy,
    });
    const isHover = ctx.tier === t;
    const mf =
      card.attrs.length === 1 &&
      card.attrs[0] === "M" &&
      card.faces.M[t] &&
      card.faces.M[t].choose &&
      !P().curse &&
      !P().slow;
    const top = (3 - t) * (S.variant === "a" ? 48.6 : 54);
    const ll = pv.reason
      ? `<span class="t">T${t}</span>${pv.reason === "—" ? '<span class="dim">—</span>' : `払う ${pv.pay}<span class="dot">・</span><span class="dim">${pv.reason}</span>`}`
      : `<span class="t">T${t}</span>払う <span class="num">${pv.payTxt}</span>${pv.heavy ? '<span class="dot">・</span>重撃 +6' : ""}<span class="dot">・</span>残 <span class="num">${pv.remain}</span><span class="dot">・</span>構え ${pv.remain >= 3 ? "○" : "×"}`;
    const split = mf
      ? `<div class="split" style="left:${S.variant === "a" ? S.px - 422 : S.px}px"><span class="l ${ctx.dir === 1 && isHover ? "on" : ""}">退き</span><span class="r ${ctx.dir === -1 && isHover ? "on" : ""}">詰め</span></div>`
      : "";
    h += `<div class="band t${t} ${isHover ? "hover" : ""} ${t === def && !pv.reason ? "def" : ""} ${pv.reason ? "hatch" : ""}" data-t="${t}" style="top:${top}px"><span class="ll">${ll}${t === def && !pv.reason && pv.remain >= 3 ? '<span class="deftag">構え維持</span>' : ""}</span>${split}<span class="rl">${pv.reason === "—" ? "—" : pv.rlabel}</span></div>`;
  }
  b.innerHTML = h;
  b.classList.add("show");
  // reserve preview, pips preview, ghost
  if (ctx.tier >= 0) {
    const pv = preview({
      idx: ctx.idx,
      tier: ctx.tier,
      target: ctx.target,
      dir: ctx.dir,
      heavy: ctx.heavy,
    });
    renderReserve(pv.payable ? pv.remain : null);
    $("pPips").innerHTML = pipsHTML(
      P().sta,
      P().staMax,
      S.miasma.lost,
      P().cover,
      pv.payable ? pv.pay : 0,
      P().intimidated,
    );
    showGhost(pv);
  } else {
    renderReserve(null);
    hideGhost();
  }
}
function showGhost(pv) {
  const g = $("ghost0");
  if (!g) return;
  if (!pv.shift || !pv.moved) {
    hideGhost();
    return;
  }
  const near = nearest();
  const idx = S.enemies.indexOf(near);

  g.style.left = nx + "px";
  g.dataset.posture = pv.ghostDists[idx];

    `移動後 ${R[pv.ghostDists[idx]]}${a && a.range != null ? " " + MULTL[Math.abs(pv.ghostDists[idx] - a.range)] : ""}`;
  renderTBands(pv.ghostDists);
}
function hideGhost() {
  const g = $("ghost0");
  if (g) g.classList.remove("show");
  renderTBands(null);
}

// ---- hit test: 帯の高さ → 段、敵の列 → 相手、列の外 → 場、自分の x で向き ----
function hitTest(x, y) {
  let tier = -1;
  if (S.variant === "a") {
    if (y >= 626 && y < 821 && x >= 422 && x <= 1498)
      tier = 3 - Math.floor((y - 626) / 48.6);
  } else if (y >= 302 && y < 626) {
    tier = y >= 562 ? 0 : 3 - Math.floor((y - 346) / 54);
    tier = clamp(tier, 0, 3);
  }
  let target = null;
  if (S.variant === "a") {
    const alive = S.enemies.map((e, i) => i).filter((i) => !S.enemies[i].down);
    const nearI = alive.reduce((a, b) => (S.enemies[b].dist < S.enemies[a].dist ? b : a));
    const farI = alive.reduce((a, b) => (S.enemies[b].dist > S.enemies[a].dist ? b : a));
    target = x < 960 ? nearI : farI;
    if (alive.length === 1) target = alive[0];
    if (Math.abs(x - 960) < 20) target = null;
  } else
    S.enemies.forEach((e, i) => {
      if (!e.down && Math.abs(x - S.ex[i]) <= ENEMY_COL()) target = i;
    });
  const dir = x < S.px ? 1 : -1;
  return { tier, target, dir };
}

const figBase = (el) => {

    el.dataset.posture === "0" ? -12 : el.dataset.posture === "2" ? 8 : 0;

    el.dataset.posture === "0" ? 1.08 : el.dataset.posture === "2" ? 0.94 : 1;

// §5.5 順 1〜2: 踏み込み 180（out）→ 止め 80。前に出た位置で保持し、stepBack で戻す（順 8）
function stepIn(el, dir) {
  const b = figBase(el)(0);

  if (f._step) f._step.cancel();
  f._step = f.animate(
    [
      { transform: `translateX(0) ${b}`, easing: "ease-out" },
      { transform: `translateX(${dir * 40}px) ${b}`, offset: 180 / 260 },
      { transform: `translateX(${dir * 40}px) ${b}` },
    ],
    { duration: D(260), fill: "forwards" },

  return f._step.finished.catch(() => {});
}
// §5.5 順 8: 戻り 220（inout）。A → M の二属性はスライドの ms を渡して合流させる（§5.4 順 2）
function stepBack(el, dir, dur = 220) {
  const f = el && el.querySelector(".fig");
  if (!f) return Promise.resolve();
  const b = figBase(el)(0);
  const fwd = f._step;
  f._step = null;
  const p = anim(
    f,
    [
      { transform: `translateX(${dir * 40}px) ${b}` },
      { transform: `translateX(0) ${b}` },
    ],
    { duration: dur, easing: "ease-in-out" },

function applyStatus(who, word, stacks, turns) {
  const def = STATUS[word] || {};
  const ex = who.statuses.find((s) => s.word === word);
  if (ex) {
    if (def.stacked) {
      ex.stacks = Math.min(3, (ex.stacks || 1) + (stacks || 1));
      ex.turns = turns || ex.turns;
    }
    return ex;
  }
  if (who.statuses.length >= 4) {
    addLog(`${word}は付かない（上限 4）`, "status");
    return null;
  }
  const s = {
    word,
    stacks: def.stacked ? stacks || 1 : undefined,
    turns: def.stacked ? turns || 3 : undefined,
  };
  who.statuses.push(s);
  if (who === P()) {
    if (word === "呪縛") P().curse = true;
    if (word === "鈍足") P().slow = true;
    if (word === "威圧") P().intimidated = true;
    if (word === "疲労") P().tired = true;
    if (word === "瘴気纏い") P().cover = Math.min(2, P().cover + 1);
  }
  return s;
}
function removeStatus(who, word) {
  who.statuses = who.statuses.filter((s) => s.word !== word);
  if (who === P()) {
    if (word === "呪縛") P().curse = false;
    if (word === "鈍足") P().slow = false;
    if (word === "威圧") P().intimidated = false;
    if (word === "疲労") P().tired = false;
  }
}

// §5.5 攻撃の解決。数字の拍（T3 で 430）で resolve する。2 面目は結果の拍 + 80（§5.4 順 2）なので呼び出し側が 80 待つ。
// 数字 600 と HP バー 300 / 500、戻り 220（順 5 の後）は await せず並行で流し、tail に入れる。
async function doAttack(o) {
  // o = {fromEl, toEl, x (target x), tier, diff, sys, raw, who(target obj), tgtIdx (enemy idx | null = player), labels[], brk, noReturn}
  const [scale, stop, shakePx] = TIER_FX[o.tier];
  const dir = o.tgtIdx == null ? -1 : 1;
  stepIn(o.fromEl, dir);
  await sleep(260);
  let shakeMs = 0;
  if (o.diff < 2) {
    const [kind, dur] = SYS_FX[o.sys || "斬"];
    fxAt(
      kind,
      o.x,
      CHEST_Y,
      scale,
      dur,
      o.tgtIdx == null ? "var(--omen)" : undefined,
    );
    flashWhite(o.toEl);
    if (o.tier === 3)
      anim(
        $("darken"),
        [{ opacity: 0 }, { opacity: 1, offset: 0.5 }, { opacity: 0 }],
        { duration: 120 },
      );
    // 順 3 の光 60 → 順 4 ヒットストップ（0 / 60 / 80 / 110）
    await sleep(60 + stop);
    // 順 5: 揺れ（的中 180 / 半減 60）。順 6〜7 の数字と HP バーは揺れの開始と同時に出す
    if (o.diff === 0 && shakePx) {
      shake(o.toEl, shakePx, 180);
      shakeMs = 180;
    } else if (o.diff === 1 && shakePx) {
      shake(o.toEl, shakePx, 60);
      shakeMs = 60;
    }
  } else {
    await sleep(60);
  }
  // numbers
  const who = o.who;
  const guardUsed = o.diff < 2 ? Math.min(who.guard, o.raw) : 0;
  const dmg =
    o.diff < 2
      ? Math.max(0, o.raw - guardUsed)
      : Math.max(0, o.raw - Math.min(who.guard, o.raw));
  const numY = CHEST_Y;
  if (o.diff === 2) floatText(o.x, numY, `空振り ${o.raw}`, "gray");
  else {
    if (guardUsed) {
      floatText(
        o.x,
        numY,
        `Guard −${guardUsed}`,
        "good",
        600,
        -87,
        dmg ? -24 : 0,
      );
      crackBadge($(o.tgtIdx == null ? "shP" : "shE" + o.tgtIdx));
    }
    if (dmg || !guardUsed)
      floatText(
        o.x,
        numY,
        `−${dmg}${(o.labels || []).map((l) => `<small>${l}</small>`).join("")}`,
        "dmg",
        600,
        -87,
        guardUsed ? 24 : 0,
      );
  }
  who.guard -= Math.min(who.guard, o.raw);
  who.hp = Math.max(0, who.hp - dmg);
  if (o.tgtIdx == null) {
    setHp(P(), "hpP");
    setGuard(P(), "shP");
    $("vignette").classList.toggle("show", P().hp < 15);
  } else {
    setHp(who, "hpE" + o.tgtIdx);
    setGuard(who, "shE" + o.tgtIdx);
  }
  if (o.diff === 0 && hasStatus(who, "脆化")) {
    removeStatus(who, "脆化");
    setTimeout(() => renderStatus(), D(150));
  }
  // §5.14 崩し
  if (o.brk && o.diff === 0 && o.tgtIdx != null) {
    const before = who.sta;
    const n = Math.min(who.sta, o.brk);
    who.sta -= n;
    for (let k = 0; k < n; k++)
      pipShatter($("pipsE" + o.tgtIdx), before - k, 80 * k);
    stagger(o.toEl);
    floatText(o.x, numY, `崩し −${n}`, "gray", 600, -60, 60);
    setTimeout(() => renderStatus(), D(380));
  }
  // 順 8: 戻り 220 は順 5 の後（T3 で 610）。A → M の二属性は戻りを出さずムーブに合流（o.noReturn）
  if (!o.noReturn) setTimeout(() => stepBack(o.fromEl, dir), D(shakeMs));
  holdTail(sleep(shakeMs + 220));
  holdTail(sleep(600));
  return dmg;
}

        },
      );
  });
  return added.length;
}

async function playCard(req) {
  const h = S.hand[req.idx];
  if (!h) return false;
  const pv = preview(req);
  if (!pv.payable) return false;
  const card = pv.card;
  const tier = req.tier;
  const p = P();
  S.busy = true;
  stage.classList.add("locked");
  const tgtIdx = pv.tgtIdx;
  const tgt = tgtIdx != null ? S.enemies[tgtIdx] : null;
  // §5.9 順 1: 条件の合図（離すと同時）
  if (pv.lit) {
    S.drag = S.drag || null;
    addLog(`特性: ${card.trait.cond} ${card.trait.eff}`, "trait");
    const dl = $("dcard").querySelector(".lamp");
    if (dl)
      anim(
        dl,
        [
          { transform: "scale(1)" },
          { transform: "scale(1.4)", offset: 0.5 },
          { transform: "scale(1)" },
        ],
        { duration: 150 },
      );
    if (S.drag) {
      S.drag.cue = card.trait.cond;
      renderDragLayer();
    }
  }
  // pay
  pipDrop($("pPips"), p.sta, pv.pay, 60);
  p.sta -= pv.pay;
  // card flies out (220 in)
  const dc = $("dcard");
  if (S.drag) {
    await anim(
      dc,
      [
        { opacity: 1 },
        {
          opacity: 0,
          transform: `scale(.35) translate(${tgt && pv.needT ? S.ex[tgtIdx] - S.drag.x + "px" : "0px"}, -120px)`,
        },
      ],
      { duration: 220, easing: "ease-in" },
    );
  } else {
    const el = $("hand").children[req.idx];
    if (el)
      await anim(
        el,
        [
          { opacity: 1 },
          { opacity: 0, transform: "translateY(-160px) scale(.8)" },
        ],
        { duration: 220, easing: "ease-in" },
      );
  }
  S.hand.splice(req.idx, 1);
  S.drag = null;
  S.sel = -1;
  S.hoverTier = -1;
  if (p.intimidated) {
    removeStatus(p, "威圧");
  }
  if (hasStatus(p, "集中")) removeStatus(p, "集中");
  renderHand();
  renderBands();
  renderDragLayer();
  renderStamina();
  renderCorner();
  hideGhost();
  // faces in resolution order (§5.4)
  const fromEl = $("figP");
  let attackDone = false;
  const faces = ORDER(card).filter((a) => card.faces[a][tier]);
  // A → M（牽制など）: 戻り 220 を出さず、結果の拍 + 80 からのスライドに合流させる（§5.4 順 2）
  const aThenM = faces[0] === "A" && faces[1] === "M" && !!tgt;
  let faceNo = 0;
  for (const a of faces) {
    const f = card.faces[a][tier];
    // §5.4 順 2: 2 面目は 1 面目の結果の拍（数字 / 到着 / 盾の輪）の 80 ms 後
    if (faceNo++ > 0) await sleep(80);
    if (a === "M") {
      const merge = aThenM && attackDone;
      if (p.curse || p.slow) {
        if (merge) stepBack(fromEl, 1);
        floatText(S.px, CHEST_Y, "動けず", "gray");
        await sleep(300);
      } else {
        if (merge) stepBack(fromEl, 1, Math.abs(pv.shift) >= 2 ? 420 : 320);
        await doMove(pv.shift, null);
      }
    } else if (a === "A") {
      if (!tgt) continue;
      const dist = tgt.dist;
      const diff = Math.abs(dist - card.range);
      let base = f.p;
      const labels = [];
      if (pv.lit && card.trait.kind === "power") {
        base += card.trait.n;
        labels.push(`+${card.trait.n} ${card.trait.cond}`);
      }
      if (pv.heavy) {
        base += 6;
        labels.push("+6 重撃");
      }
      if (p.followUp) {
        base += 5;
        labels.push("+5 追撃");
        p.followUp = 0;
      }
      if (hasStatus(p, "強化")) {
        base *= 2;
        labels.push("×2 強化");
        removeStatus(p, "強化");
      }
      const frag = hasStatus(tgt, "脆化");
      if (frag && diff === 0) labels.push("×1.5 脆化");
      if (diff) labels.push(MULTL[diff]);
      const raw = roundAway(base * (frag && diff === 0 ? 1.5 : 1) * MULT[diff]);
      const dmg = await doAttack({
        fromEl,
        toEl: $("figE" + tgtIdx),
        x: S.ex[tgtIdx],
        tier,
        diff,
        sys: card.sys,
        raw,
        who: tgt,
        tgtIdx,
        labels,
        brk: f.brk,
        noReturn: aThenM,
      });
      addLog(
        `「${card.name}」T${tier} → ${tgt.tag}。${diff === 2 ? `空振り（${raw}）` : `${dmg} ダメージ`}`,
      );
      attackDone = true;
    } else if (a === "G") {
      let g = f.g;
      let lab = null;
      if (pv.lit && card.trait.kind === "guard") {
        g += card.trait.n2 || card.trait.n;
        lab = card.trait.cond;
      }
      await doGuard(g, lab);
    } else if (a === "Sk") {
      if (f.draw) {
        const n = drawCards(f.draw);
        await sleep(220 + 70 * n);
      }
      if (f.heal) {
        p.hp = Math.min(p.hpMax, p.hp + f.heal);
        setHp(p, "hpP");
        floatText(S.px, CHEST_Y, `+${f.heal}`, "warm");
        await sleep(400);
      }
      for (const w of f.foe || []) {
        if (!tgt) break;
        const word = Array.isArray(w) ? w[0] : w;
        const stacks = Array.isArray(w) ? w[1] : undefined;
        const diff = Math.abs(tgt.dist - card.range);
        if (diff) {
          floatText(S.ex[tgtIdx], CHEST_Y, "届かず", "gray");
          await sleep(200);
          continue;
        }
        if (applyStatus(tgt, word, stacks, 3)) {
          addLog(`${tgt.tag}に ${word}${stacks ? " " + stacks : ""}`, "status");
          await doStatusFx(tgt, tgtIdx, word, true);
        }
      }
      for (const w of f.self || []) {
        applyStatus(p, w);
        await doStatusFx(p, null, w, false);
      }
    } else if (a === "St") {
      await doStance(card, tier, f);
    }
  }
  // trait effects after faces
  if (pv.lit) {
    const tr = card.trait;
    if (tr.kind === "stamina") {
      p.sta = Math.min(effMax(), p.sta + 1);
      renderStamina();
      const pp = $("pPips");
      pipLight(pp, p.sta - 1, p.sta, 80);
      floatText(S.px, CHEST_Y, `+1<small>スタミナ ${tr.cond}</small>`, "acc");
      await sleep(200);
    }
    if (tr.kind === "draw") {
      drawCards(1);
      await sleep(220);
    }
    if (tr.kind === "recover") {
      p.reserve = 1;
      renderStamina();
    }
    if (tr.kind === "guard" && !card.faces.G) {
      await doGuard(tr.n, tr.cond);
    }
    if (tr.kind === "followup") {
      p.followUp = 5;
      renderStamina();
    }
    if (tr.kind === "status" && tgt && tgt.dist === card.range) {
      const ex = tgt.statuses.find((s) => s.word === tr.param);
      if (ex && ex.stacks) {
        ex.stacks = Math.min(3, ex.stacks + 1);
        renderStatus();
      }
    }
  }
  card.attrs.forEach((a) => S.played[a]++);
  S.playedCount++;
  S.lastAttrs = card.attrs;
  // 数字の尾（600）と戻り（220）が流れ切ってから再描画する
  await tail;
  const dead = S.enemies.filter((e) => !e.down && e.hp <= 0);
  for (const e of dead) {
    e.down = true;
    const idx = S.enemies.indexOf(e);
    await anim(
      $("figE" + idx).querySelector(".fig"),
      [
        { transform: figBase($("figE" + idx))(0), opacity: 1 },
        { transform: "scaleX(-1) rotate(70deg) scaleY(.9)", opacity: 0.35 },
      ],
      { duration: 800, easing: "ease-in" },
    );
    addLog(`${e.tag}を撃破`);
  }
  S.busy = false;
  stage.classList.remove("locked");
  render();
  if (S.enemies.every((e) => e.down)) {
    await showVictory();
  }
  return true;
}

// §5.13 構え・ターン終了・敵の番
async function endTurn() {
  const p = P();
  S.busy = true;
  stage.classList.add("locked");
  S.sel = -1;
  S.drag = null;
  renderBands();

  if (p.sta >= 3) {
    pipGlow($("pPips"), 3);
    await sleep(250);
    p.guard += 3;
    setGuard(p, "shP");
    popBadge($("shP"));
    floatText(S.px, CHEST_Y, "+3<small>構え</small>", "good");
    addLog(`構え。残 ${p.sta} → Guard +3`);

  }
  const cards = [...$("hand").children];
  cards.forEach((el, k) =>
    anim(
      el,
      [
        { opacity: 1 },

          opacity: 0,

      ],

  renderStamina();
  renderCorner();
  await sleep(150);
  S.phase = "enemy";

  phaseBanner("敵の番", true, 400);
  await sleep(400);
  await enemyPhase();
  if (p.hp <= 0) {
    await showDefeat();
    S.busy = false;

  }
  await newTurn();
  S.busy = false;
  stage.classList.remove("locked");
}
function enemyInvest(e, act) {
  let best = -1;
  for (let n = act.min; n <= 3; n++) if (n <= e.sta && e.sta - n >= 3) best = n;
  if (best < 0 && act.min <= e.sta) best = act.min;
  return best;
}
function pickOmen(e) {
  const ids = ENEMIES[e.id].tree[e.dist];
  for (const id of ids) {
    const a = ENEMIES[e.id].acts[id];
    if (a.attrs.includes("St") && e.stance) continue;
    if (a.min <= e.sta) return omenOf(e.id, id);
  }
  return null;
}
async function enemyPhase() {
  const p = P();
  for (let i = 0; i < S.enemies.length; i++) {
    const e = S.enemies[i];
    if (e.down) continue;
    if (i > 0) await sleep(600);
    // 順 6: Guard 0 → 回復 → スタンス → tick
    e.guard = 0;
    setGuard(e, "shE" + i);
    await sleep(150);
    const rec = RECOVER[e.dist];
    const before = e.sta;
    e.sta = Math.min(e.staMax, e.sta + rec);
    pipLight($("pipsE" + i), before, e.sta, 80);
    await sleep(80 * rec + 100);
    const bleed = e.statuses.find((s) => s.word === "出血");
    if (bleed) {
      const d = 2 * bleed.stacks;
      e.hp = Math.max(0, e.hp - d);
      setHp(e, "hpE" + i);
      floatText(S.ex[i], CHEST_Y, `−${d}<small>出血</small>`, "dmg");
      bleed.stacks -= 1;
      bleed.turns -= 1;
      if (bleed.stacks <= 0) removeStatus(e, "出血");
      renderStatus();
      await sleep(600);
    }
    // 順 7: 予兆どおりに実行
    const o = e.omens[0];
    if (!o) continue;
    const act = actOf(o);
    const diff = act.range != null ? Math.abs(e.dist - act.range) : 0;
    const el = $("figE" + i);
    if (act.attrs.includes("A") && diff === 2) {
      e.struck = true;
      renderLane();
      await sleep(200);
      const home = ENEMIES[e.id].home;
      const sh = home < e.dist ? -1 : home > e.dist ? 1 : 0;
      if (sh && !hasStatus(e, "鈍足")) {
        await doMove(sh, i);
        addLog(
          `${e.tag}「${act.name}」は空振り。間合い取り直しで「${R[e.dist]}」へ`,
        );
      } else addLog(`${e.tag}「${act.name}」は空振り（動けず）`);
    } else {
      const n = enemyInvest(e, act);
      if (n < 0) {
        addLog(`${e.tag}は休み（回復のみ）`);
      } else {
        const t = act.tiers[n];
        e.sta -= n;
        pipDrop($("pipsE" + i), e.sta + n, n, 60);
        anim(
          $("omen" + i).querySelector(".fill"),
          [{ opacity: 0 }, { opacity: 0.8, offset: 0.5 }, { opacity: 0 }],
          { duration: 200 },
        );
        await sleep(200);
        if (act.moveFirst && t.shift) await doMove(t.shift, i);
        if (act.attrs.includes("A")) {
          let base = t.p;
          const labels = [];
          if (diff) labels.push(MULTL[diff]);
          const frag = hasStatus(p, "脆化");
          if (frag && diff === 0) labels.push("×1.5 脆化");
          const raw = roundAway(
            base * (frag && diff === 0 ? 1.5 : 1) * MULT[diff],
          );
          const dmg = await doAttack({
            fromEl: el,
            toEl: $("figP"),
            x: S.px,
            tier: n,
            diff,
            sys: act.sys,
            raw,
            who: p,
            tgtIdx: null,
            labels,
          });
          addLog(`${e.tag}「${act.name}」T${n}。${dmg} ダメージ`);
          // §5.7 順 7: push は攻撃の数字の拍で
          if (act.push && diff === 0) {
            floatText(S.px, CHEST_Y, "押し戻し +1", "gray", 600, -60);
            await doMove(1, null);
            addLog(`押し込まれて「${R[e.dist]}」へ`);
          }
          // §5.4 順 2 / §5.10: 相手に付く状態は数字の拍 + 80 で気の印
          for (const w of t.foe || []) {
            if (diff === 0) {
              const word = Array.isArray(w) ? w[0] : w;
              await sleep(80);
              if (applyStatus(p, word, Array.isArray(w) ? w[1] : undefined, 3))
                await doStatusFx(p, null, word, true);
            }
          }
        }
        if (act.attrs.includes("G") && t.g) await doGuard(t.g, null, e, i);
        if (!act.moveFirst && t.shift) await doMove(t.shift, i);
        if (t.home) {
          const sh =
            ENEMIES[e.id].home < e.dist
              ? -1
              : ENEMIES[e.id].home > e.dist
                ? 1
                : 0;
          if (sh) await doMove(sh, i);
        }
        if (act.attrs.includes("Sk") && t.foe && diff === 0) {
          for (const w of t.foe) {
            const word = Array.isArray(w) ? w[0] : w;
            if (applyStatus(p, word)) await doStatusFx(p, null, word, true);
          }
        }
        if (act.attrs.includes("Sk") && diff !== 0 && t.foe) {
          floatText(S.px, CHEST_Y, "届かず", "gray");
          await sleep(200);
        }
      }
    }
    // 行動の尾（数字 600 / 戻り 220）が流れ切ってから次へ
    await tail;
    if (p.hp <= 0) return;
    if (p.slow) removeStatus(p, "鈍足");
    // 順 8: 敵の構え。残 ≥ 3 なら敵ピップ 1〜3 が光り（250）→ 盾バッジ +3（300）
    if (e.sta >= 3) {
      pipGlow($("pipsE" + i), 3);
      await sleep(250);
      e.guard += 3;
      setGuard(e, "shE" + i);
      popBadge($("shE" + i));
      floatText(S.ex[i], CHEST_Y, "+3<small>構え</small>", "good");
      await sleep(300);
    }
    // 順 9: 次の予兆（降下 260）。狙い帯は fade-in 300（§5.8 提示）
    e.struck = false;
    e.omens = [pickOmen(e)].filter(Boolean);
    renderLane();
    renderStatus();
    const ob = $("omen" + i);
    if (ob)
      await anim(
        ob,
        [
          { transform: "translate(-50%,-30px)", opacity: 0 },
          { transform: "translate(-50%,0)", opacity: 1 },
        ],
        { duration: 260, easing: "ease-out" },
      );
    renderTBands(null);
    anim($("tbands"), [{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
    if (e.omens[0]) addLog(`${e.tag}の予兆: ${actOf(e.omens[0]).omen}`);
  }
}
// §5.1 ターン開始
async function newTurn() {
  const p = P();
  S.turn++;
  S.phase = "player";
  renderTop();
  phaseBanner("あなたの番", false, 300);
  await sleep(300);
  p.guard = 0;
  setGuard(p, "shP");
  await sleep(150);
  const near = nearest();
  let rec = RECOVER[near.dist] + (p.reserve ? 1 : 0) - (p.tired ? 1 : 0);
  p.reserve = 0;
  if (p.tired) removeStatus(p, "疲労");
  const before = p.sta;
  p.sta = Math.min(effMax(), Math.max(0, p.sta + rec));
  renderStamina();
  $("pPips").innerHTML = pipsHTML(
    before,
    p.staMax,
    S.miasma.lost,
    p.cover,
    0,
    false,
  );
  pipLight($("pPips"), before, p.sta, 80);
  $("staN").textContent = p.sta;
  floatText(
    S.px,
    CHEST_Y,
    `+${p.sta - before}<small>回復（${R[near.dist]}）</small>`,
    "acc",
  );
  addLog(
    `ターン ${S.turn}。間合い「${R[near.dist]}」で回復 +${p.sta - before}（${before} → ${p.sta}）`,
  );
  // 順 4: スタンスのターン開始付与（300）は順 3 の点灯（80 × n）と同時。待ちは max(80 × n, 300)
  const recN = Math.max(0, p.sta - before);
  const stanceP = p.stance && p.stance.g ? doGuard(p.stance.g, "型") : null;
  await Promise.all([sleep(80 * recN), stanceP || sleep(300)]);
  // 順 5: 状態の tick（600）。順 6〜7: 全捨てとドロー（220、70 ずらし）は順 5 と同時
  const regen = p.statuses.find((s) => s.word === "再生");
  if (regen) {
    p.hp = Math.min(p.hpMax, p.hp + 2);
    setHp(p, "hpP");
    floatText(S.px, CHEST_Y, "+2<small>再生</small>", "warm");
    regen.turns -= 1;
    if (regen.turns <= 0) removeStatus(p, "再生");
  }
  const bleed = p.statuses.find((s) => s.word === "出血");
  if (bleed) {
    const d = 2 * bleed.stacks;
    p.hp = Math.max(0, p.hp - d);
    setHp(p, "hpP");
    floatText(S.px, CHEST_Y, `−${d}<small>出血</small>`, "dmg");
    bleed.stacks -= 1;
    if (bleed.stacks <= 0) removeStatus(p, "出血");
  }
  if (regen || bleed) renderStatus();
  if (p.curse) {
    removeStatus(p, "呪縛");
  }
  const drew = drawCards(5);
  const drawMs = 220 + (drew >= 6 ? 50 : 70) * Math.max(0, drew - 1);
  await sleep(Math.max(600, drawMs));
  // 順 8〜10: 予兆の明滅 250（敵の行動順に 120 ずらし）、狙い帯の更新、再計算は同時
  render();
  S.enemies.forEach((e, i) => {
    const ob = $("omen" + i);
    if (ob)
      anim(
        ob,
        [{ opacity: 1 }, { opacity: 0.3, offset: 0.5 }, { opacity: 1 }],
        { duration: 250, delay: 120 * i },
      );
  });
  await sleep(250 + 120 * Math.max(0, S.enemies.length - 1));
}

      setup(opt = {}) {
        const boss = opt.who === 'priest';
        freshState({ scene: 'elite', floor: boss ? 5 : 3, turn: boss ? 9 : 5, chain: { index: 3, total: 3 } });
        if (!boss) {
          // §1.1 B5 / B6 の追撃バッジを静止画で 1 枚出す。番人: 前フェーズの 2 手目「盾を構える」の特性 手薄（相手の Guard 0）で追撃 +5 が予約済み（roster §4）。
          // 自分: 浄化の一閃 T1（A+St、cards §3 #43）を出し、予兆(攻撃) で追撃 +5。スタンス枠に浄化の一閃、played は A 1 / St 1
          S.enemies = [mkEnemy('warden', { hp: 74, sta: 12, guard: 6, dist: 0, followUp: 5, omens: [omenOf('warden', 'helm'), omenOf('warden', 'bash')], omenTotal: '13〜23（+5 追撃、+3 連動）', stance: { name: '鉄壁', tier: 3, short: 'Guard +4 / T' } })];
          Object.assign(P(), { hp: 31, guard: 0, sta: 6, followUp: 5, statuses: [{ word: '鈍足' }], slow: true, stance: { id: '浄化の一閃', name: '浄化の一閃', tier: 1, short: '狙い帯 Guard +2', when: true, whenText: '狙い間合いに居る' } });
          S.played = { A: 1, G: 0, St: 1, Sk: 0, M: 0 }; S.playedCount = 1; S.lastAttrs = ['A', 'St'];
          S.hand = mkHand(['iron_block', 'kesa_cut', 'footwork', 'brace', 'lunge']);
          // 盾打ちの鈍足は T1 から（roster §4）。前フェーズは 盾打ち T1 → 盾を構える T0 の 2 手（連動なし = 3）
          S.log = [{ t: '特性: 予兆(攻撃) 追撃 +5（浄化の一閃 T1、次のアタック面）', cls: 'trait' }, { t: '番人の予兆: 兜割り・近 / 予定: 盾打ち（+3 連動、鈍足）' }, { t: '番人「盾を構える」T0。Guard +3。手薄（Guard 0）で追撃 +5', cls: 'trait' }, { t: '番人「盾打ち」T1。3 ダメージ、鈍足', cls: 'status' }, { t: '番人「兜割り」T3。12 ダメージ、崩し 2' }];
        } else {
          S.enemies = [mkEnemy('priest', { hp: 72, sta: 11, dist: 1, stage2: true, adapt: 'breaker', omens: [omenOf('priest', 'staff'), omenOf('priest', 'word')], omenTotal: '8〜15 + 呪縛', stance: { name: '瘴気の帳', tier: 3, short: 'Guard +5（遠）', when: false, whenText: '遠で有効' } })];
          Object.assign(P(), { hp: 26, guard: 9, sta: 5, cover: 2, curse: true, tired: true, intimidated: true, statuses: [{ word: '瘴気纏い', stacks: 2 }, { word: '呪縛' }, { word: '疲労' }, { word: '威圧', blink: true }] });
          S.hand = mkHand(['stone_throw', 'footwork', 'brace', 'thrust', 'lunge']);
          S.log = [{ t: '適応: 崩しを狙う（Guard 9 以上で 2 ターン）', cls: 'stance' }, { t: '司祭「縛りの言葉」T1。呪縛、威圧', cls: 'status' }, { t: '司祭「瘴気の儀」T2。瘴気纏い 2 段目、自分に再生', cls: 'status' }];
        }
        render();
        if (opt.bands) { S.showBands = true; S.staticIdx = boss ? 0 : 1; renderBands(); }
        subbar([{ lbl: '敵' }, { label: '甲冑の番人（精鋭、2 行動）', on: !boss, onClick: () => SCENES.elite.setup({ who: 'warden', bands: opt.bands }) }, { label: '瘴気の司祭（ボス、第 2 段階）', on: boss, onClick: () => SCENES.elite.setup({ who: 'priest', bands: opt.bands }) }, { sep: true }, { label: '帯を表示', on: !!opt.bands, onClick: () => SCENES.elite.setup({ who: opt.who, bands: !opt.bands }) }, { sep: true }, { label: '手記（ボスは適応条件 4 文）', onClick: () => openJournal(0) }, { hint: boss ? '§2.3 ケース 2: 瘴気纏い 2 + 呪縛 + 疲労 + 威圧。帯を表示すると T3 に斜線「威圧 −1」' : '§2.3 ケース 1 相当: 鈍足を受けたターン。ムーブ面は「移動 0（鈍足）」。追撃 +5 のバッジは自分が属性チップの隣（B6）、番人が行 B の右端（B5）' }]);
        setStep(boss ? '<b>瘴気の司祭・第 2 段階</b>　1 手目 錫杖の打ち込み・中・8〜15・崩し 2（左端に適応の印 = 崩し）、2 手目 縛りの言葉・遠（点線の狙い帯 α .45、遠に居なければ「届かず」）。HP 72 / 160、80 の目印線を過ぎた。塞ぎ板 2 枡 + 破線 1 枡でスタミナ 5 / 7' : '<b>甲冑の番人</b>　1 手目 兜割り・近・7〜12・崩し 1〜2（実線 ▼）、2 手目 盾打ち・近・1〜6（+3 連動）・鈍足（点線「予定」）、計 13〜23（+5 追撃、+3 連動）。鉄壁 T3 が枠に。番人は前フェーズの「盾を構える」の手薄で追撃 +5 を予約。自分も浄化の一閃の予兆(攻撃) で追撃 +5（帯を表示すると威力に「+5 追撃」）。自分は鈍足でムーブ面が 0');
      },
    },
    drag: {
      title: '操作（動く）: ドラッグ主操作 + クリック / キーの副操作（§3）',
      caption: 'カードを掴んで上へ。中心が手札の上端（76%）を越えると 0.55 倍に縮み、左に予測札（240×170、9 行）が付き、投入帯 4 本が出る。帯の高さで投入量、敵の列（±130 px）で矢印（1 体は自動）、列の外は場。単属性ムーブの T1 / T3 は帯を自分の x で左 = 退き / 右 = 詰めに割る。払えない帯は斜線。Shift / 右クリック / ホイールで重撃（条件ランプ ● のときだけ）。右クリックか長押し 400 ms で詳細（面ごとの 4 段表）。クリック選択 → 帯クリックでも同じ結果。キー: 1〜8 選択、↑↓ 段、Q/W/E/R 確定、←→ 向き、Enter 確定、X ターン終了、Esc 取り消し、I 詳細、J 手記。',
      setup() {
        freshState({ scene: 'drag', interactive: true, turn: 3, piles: { draw: 15, discard: 0, exile: 0 }, deckPos: 5 });
        S.enemies = [mkEnemy('polearm', { hp: 60, sta: 10, dist: 1, omens: [omenOf('polearm', 'sweep')] })];
        Object.assign(P(), { hp: 50, guard: 0, sta: 7, statuses: [], stance: null });
        S.hand = mkHand(['kesa_cut', 'lunge', 'footwork', 'brace', 'whirlwind']);
        S.log = [{ t: 'ターン 3。間合い「中」で回復 +2（5 → 7）' }, { t: '長柄の予兆: 薙ぎ払い・中・6〜13' }];
        render();
        subbar([{ label: '手札を配り直す（初期状態）', onClick: () => SCENES.drag.setup(), always: true }, { sep: true }, { label: '手記（J）', onClick: () => openJournal(0) }, { hint: '足運びをプレイすると旋風斬りの「連動(M): 重撃」が ● になり、Shift で重撃 +6（払う +1）を切り替えられる。呼吸を整えるを T0 で出すと 温存（残 ≥ 6）が発火し、回復予告の右端に「+1 予約」バッジが出る（B7）' }]);
        setStep('<b>操作</b>　主操作はドラッグ（帯 = 投入量、矢印 = 相手、場 = 自分と全体）。予測値は全て確定値（乱数なし）。T0 も他の段と同じ形で予測を出す。ターン終了（X）で構え → 全捨て → 敵フェーズ → 次のターン（回復 → ドロー 5）まで回ります');
      },
    },
    turn: {
      title: '1 ターン再生（§5 の ms で再生。早送り ×10 でも同じ結果）',
      caption: 'タイムラインは {t, name, fn} の配列で持ち、各手順の名前を下に流す。順: ターン開始（バナー / Guard 0 / 回復 / ドロー 5 / 予兆の明滅 250。予兆は前の敵フェーズ末で降りている）→ 足運び T3（退き 2、特性 初手: スタミナ +1 が発火）→ 石礫 T1（二属性 A + Sk、突 + 気の 2 系統、脆化の付与）→ ターン終了と構え +3 → 敵フェーズ（石突きの押し込み・近 が遠で空振り → 間合い取り直し）→ 次の予兆（薙ぎ払い・中、降下 260 + 狙い帯 fade-in 300）→ 次のターン。',
      setup() {
        freshState({ scene: 'turn', turn: 2, piles: { draw: 12, discard: 4, exile: 0 }, deckPos: 0, deck: ['footwork', 'stone_throw', 'thrust', 'brace', 'observe', 'kesa_cut', 'lunge', 'wrist_cut', 'iron_block', 'footwork'] });
        S.enemies = [mkEnemy('polearm', { hp: 51, sta: 7, dist: 0, omens: [omenOf('polearm', 'shove')] })];
        Object.assign(P(), { hp: 42, guard: 0, sta: 6, statuses: [], stance: null });
        S.hand = []; S.phase = 'enemy';
        S.log = [{ t: 'ターン 2。近に張り付いて突きを当てた（9 ダメージ）' }, { t: '長柄の予兆: 石突きの押し込み・近' }];
        render(); // 予兆は敵フェーズ末で既に降りているので、レーンと狙い帯は最初から出す（§5.1）
        const tl = turnTimeline();
        subbar([{ label: '再生（×1）', run: true, onClick: () => runTimeline(tl, 1) }, { label: '早送り（×10）', run: true, onClick: () => runTimeline(tl, 10) }, { label: 'リセット', onClick: () => SCENES.turn.setup(), always: true }, { hint: `手順 ${tl.length}、合計約 ${(tl[tl.length - 1].t / 1000 + 2.5).toFixed(1)} 秒（×10 で約 ${((tl[tl.length - 1].t / 1000 + 2.5) / 10).toFixed(1)} 秒）` }]);
        $('stepbar').innerHTML = `<b>待機中</b>　「再生」で開始。<div class="tl">${tl.map((s, k) => `<span>${k + 1} ${s.name.split('：')[0]}</span>`).join('')}</div>`;
      },
    },
    chain: {
      title: '連戦（撃破 → 持ち越し → 休憩の選択 → 次の敵、結果画面、敗北、手記、§2.6 / §5.18 / §5.19）',
      caption: '撃破後の順は「倒れ 800 → 撃破パネル 300 → 持ち越し（HP / スタミナ / 瘴気 / 階層）300 → 休憩の選択 768×432（休む: HP +30% + スタミナ全回復 / そのまま進む）→ 切替バナー「2 戦目 影走りの犬」→ 瘴気 +6%（濃度 2 × 3%）→ 次の敵が靄から現れ、予兆が降りる → ターン開始」。敗北は「墨 → 力尽きた → 結果画面（何戦目 / 残 HP / 属性の内訳 / 0 投入 / 平均ターン）→ 手記の頁」。数字は即値で出し、カウントアップしない。',
      setup() {
        freshState({ scene: 'chain', turn: 6, chain: { index: 1, total: 3 } });
        // 「中へ押された」ので dist は 1（中）。中の長柄は薙ぎ払いを予告し、近の札 突き T2（14）は ×0.5 で 7
        S.enemies = [mkEnemy('polearm', { hp: 4, sta: 5, dist: 1, omens: [omenOf('polearm', 'sweep')] })];
        Object.assign(P(), { hp: 20, guard: 0, sta: 4, statuses: [], stance: { id: '岩の構え', name: '岩の構え', tier: 2, short: 'Guard +3 / T', g: 3 } });
        S.hand = mkHand(['thrust', 'brace', 'footwork']);
        S.log = [{ t: '「突き」T2 → 長柄。7 ダメージ（14 ×0.5）' }, { t: '長柄「石突きの押し込み」T1。3 ダメージ、中へ押された' }];
        render();
        subbar([{ label: '撃破 → 持ち越し → 休憩 → 次の敵', run: true, onClick: () => runChain() }, { label: '結果画面（全勝時の仮定）', run: true, onClick: async () => { await showResult({ title: '3 戦を生き延びた', hp: P().hp, attrs: { A: 12, G: 6, St: 3, Sk: 5, M: 7 }, zero: 5, avgTurns: '5.7', next: '継承の間へ' }); hideOverlays(); } }, { label: '敗北画面', run: true, onClick: async () => { S.busy = true; await showDefeat(); S.busy = false; } }, { sep: true }, { label: '手記ドロワー', onClick: () => openJournal(0) }, { label: 'リセット', onClick: () => SCENES.chain.setup(), always: true }, { hint: '休憩は ← / → で焦点、Enter で決定（焦点が無い間は Enter が効かない）。マウスはクリック' }]);
        setStep('<b>連戦</b>　1 / 3 戦、長柄の歪み兵 HP 4。「撃破 → …」で一連の流れを再生します');
      },
    },
  };
  async function runChain() {
    S.busy = true; stage.classList.add('locked');
    setStep('<b>撃破</b>　最後の敵が崩れ落ちる 800 ms、足元の灯りが消える 600 ms →「撃破」scale .94 → 1（300）→ 持ち越しパネル 300、スタンス枠が空になる');
    const e = S.enemies[0]; e.hp = 0; setHp(e, 'hpE0');
    await anim($('figE0').querySelector('.fig'), [{ transform: figBase($('figE0'))(0), opacity: 1 }, { transform: 'scaleX(-1) rotate(70deg) scaleY(.9)', opacity: .35 }], { duration: 800, easing: 'ease-in', fill: 'forwards' });
    e.down = true; await showVictory(); await sleep(900);
    setStep('<b>休憩の選択</b>　768×432 の和紙。上段に前後の値、共通で瘴気の予告と次の敵。下段の 2 択は既定の強調なし');
    const rest = await restChoice('hound');
    const p = P();
    if (rest) { p.hp = Math.min(p.hpMax, p.hp + 15); const b = p.sta; p.sta = effMax(); renderStatus(); renderStamina(); pipLight($('pPips'), b, p.sta, 80); await sleep(80 * (p.sta - b) + 300); addLog('休んだ。HP +15、スタミナ全回復'); } else addLog('そのまま進んだ');
    $('overlay').classList.remove('show'); $('overlay').innerHTML = '';
    setStep(`<b>切替</b>　${rest ? '休む: HP バーが伸びる 300、ピップ全点灯 80 × n' : 'そのまま進む'} → 盤面が暗くなり「2 戦目 影走りの犬」300 → 瘴気ゲージ +6% が 200 で伸びる → 次の敵が靄から現れる 400 → 予兆が降りる 260`);
    anim($('darken'), [{ opacity: 0 }, { opacity: 1 }], { duration: 400, easing: 'ease-in', fill: 'forwards' });
    await chainBanner('2 戦目　影走りの犬', `第 ${S.floor} 階層 ・ 2 / 3 戦`);
    // §5.18 順 7: 瘴気ゲージは増分ぶん 200 で伸びる（新しいセルを 200 / n ずつ点灯）
    const cellsBefore = Math.round(S.miasma.pct / 10);
    S.chain.index = 2; S.turn = 0; S.miasma.pct += S.miasma.density * 3; renderTop();
    const newCells = [...$('topLeft').querySelectorAll('.meter.miasma .cells i')].slice(cellsBefore, Math.round(S.miasma.pct / 10));
    newCells.forEach((c, k) => anim(c, [{ opacity: 0 }, { opacity: .85 }], { duration: 200 / newCells.length, delay: (200 / newCells.length) * k, easing: 'ease-out' }));
    await sleep(200);
    S.enemies = [mkEnemy('hound', { dist: 0, omens: [] })]; p.stance = null; S.hand = []; S.piles = { draw: 12, discard: 0, exile: 0 };
    render(); $('lane').innerHTML = '';
    $('darken').getAnimations().forEach(a => a.cancel());
    await anim($('figE0'), [{ opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0)' }], { duration: 400, easing: 'ease-out' });
    S.enemies[0].omens = [omenOf('hound', 'bite')]; renderLane();
    await anim($('omen0'), [{ transform: 'translate(-50%,-30px)', opacity: 0 }, { transform: 'translate(-50%,0)', opacity: 1 }], { duration: 260, easing: 'ease-out' });
    renderTBands(null); anim($('tbands'), [{ opacity: 0 }, { opacity: 1 }], { duration: 300 }); addLog('犬の予兆: 噛みつき・近・5〜10');
    setStep('<b>ターン開始</b>　§5.1（初戦と同じく提示を含む）。HP とスタミナは持ち越し、瘴気は 32% → 38%');
    await newTurn(); S.busy = false; stage.classList.remove('locked');
  }

  // =====================================================================
  // 12. wiring: tabs / hash / scale
  // =====================================================================
  function switchScene(name) {
    if (!SCENES[name]) name = 'layout';
    tlGen++; tlRunning = false; SPEED = 1;
    document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.scene === name ? 'true' : 'false'));
    SCENES[name].setup();
    $('caption').textContent = SCENES[name].caption;
    document.title = `戦闘 UI / UX v4 モックアップ — ${SCENES[name].title}`;
  }
  document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.scene; }));
  window.addEventListener('hashchange', () => switchScene(location.hash.slice(1)));
  const fit = () => { stage.style.setProperty('--s', $('frame').clientWidth / 1920); };
  new ResizeObserver(fit).observe($('frame')); fit();
  Object.defineProperty(window, 'S', { get: () => S });
  switchScene(location.hash.slice(1) || 'layout');
})();
</script>
