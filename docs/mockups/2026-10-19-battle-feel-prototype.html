:root, [data-theme="dusk"] { --ground: #10141d; --panel: rgba(16,20,30,.88); --panel-solid: #141925; --card: #171c28; --ink: #ecebf2; --ink-muted: #a9adbd; --rule: rgba(157,166,186,.26); --steel: #6d7787; --amber: #e8a84c; --wick: #ffd89a; --crimson: #c2483f; --hp-text: #e36a5e; --violet: #8b6fd0; --reach-red: #ff1f4f; --phosphor: #b9a3ff; --guard: #8fc4d8; --miss: var(--steel); --caution: #e6c35c; --boss: #d08cf0; --washi: #f0e6d0; --washi-ink: #1d1a16; --figure-self: #2b2f3a; --figure-enemy: #1b1722; --sky-top: #1d3340; --sky-bottom: #182b37; --meadow-top: #182b37; --meadow-bottom: #152530; --earth-top: #13212b; --earth-bottom: #0f1a22; --floor-tile: rgba(10,16,22,.72); --sun: rgba(255,255,255,.10); --haze: rgba(255,255,255,.05); --keyline: rgba(16,20,30,0); --shadow-card: 0 6px 14px rgba(0,0,0,.45); --shadow-lamp: 0 0 0 2px #ffd89a, 0 0 20px 5px rgba(255,216,154,.5); --shadow-threat: 0 0 8px rgba(255,31,79,.3); --shadow-reach: 0 0 22px rgba(232,168,76,.5); --shadow-omen-active: 0 0 30px rgba(139,111,208,.6); --shadow-tip: 0 8px 18px rgba(0,0,0,.45); }
[data-theme="wakakusa-a"] { --sky-top: #f4f2df; --sky-bottom: #dde9cb; --meadow-top: #b9d394; --meadow-bottom: #86a862; --earth-top: #5f7d45; --earth-bottom: #10170d; --floor-tile: rgba(14,20,12,.82); --sun: rgba(255,255,255,.55); --haze: rgba(255,255,255,.14); --keyline: rgba(16,20,30,.85); }
[data-theme="wakakusa-b"] { --sky-top: #e3ebd3; --sky-bottom: #c3d6ad; --meadow-top: #97b878; --meadow-bottom: #64844c; --earth-top: #4a663a; --earth-bottom: #0c130b; --floor-tile: rgba(12,18,12,.80); --sun: rgba(255,255,255,.35); --haze: rgba(255,255,255,.10); --keyline: rgba(16,20,30,.85); }
:root { --space-4: 4px; --space-6: 6px; --space-8: 8px; --space-12: 12px; --space-16: 16px; --space-24: 24px; --space-32: 32px; --space-48: 48px; --radius-panel: 6px; --radius-plate: 5px; --radius-tag: 4px; --radius-chip-foe: 3px; --radius-chip-self: 15px; --radius-pip: 50%; --stroke-rule: 1px; --stroke-frame: 2px; --stroke-icon: 2.2px; --stroke-bold: 3px; --dash: 3px; --hatch-gap: 11px; --opacity-unpayable: 0.6; --opacity-held: 0.92; --opacity-idle-hooks: 0.75; --opacity-unplayed: 0.55; --opacity-enemy-turn: 0.4; --opacity-guard-zero: 0.7; --screen-w: 1920px; --screen-h: 1080px; --card-w: 216px; --card-h: 304px; --cell-h: 40px; --figure-h: 226px; --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif; --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; }

/* Original Card Battle — battle screen components. Every colour and size comes from tokens.css (tokens.json). */

.ocb-root, .ocb-root *, .ocb-root *::before, .ocb-root *::after { box-sizing: border-box; }
.ocb-root { font-family: var(--font-body); color: var(--ink); -webkit-font-smoothing: antialiased; line-height: 1.375; }
.ocb-root p { margin: 0; }
.ocb-mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ocb-disp { font-family: var(--font-display); }
.ocb-icon { display: inline-block; flex: none; overflow: visible; vertical-align: middle; }

/* ---------- panels ---------- */
.ocb-root .ocb-panel { background: var(--panel); border: var(--stroke-rule) solid var(--rule); border-radius: var(--radius-panel); }
.ocb-root .ocb-solid { background: var(--panel-solid); border: var(--stroke-rule) solid var(--steel); border-radius: var(--radius-panel); }

/* ---------- card (216×304) ---------- */
.ocb-root .ocb-card { position: relative; width: 216px; height: 304px; border-radius: var(--radius-panel); background: var(--card); box-shadow: var(--shadow-card); --attr: var(--steel); --attr-ink: var(--ink); user-select: none; }
.ocb-root .ocb-card.is-attack { --attr: var(--violet); --attr-ink: var(--phosphor); }
.ocb-root .ocb-card.is-defense { --attr: var(--guard); --attr-ink: var(--guard); }
.ocb-root .ocb-card.is-skill { --attr: var(--amber); --attr-ink: var(--amber); }
.ocb-root .ocb-card.is-stance { --attr: var(--crimson); --attr-ink: var(--hp-text); }
.ocb-root .ocb-card-clip { position: absolute; inset: 0; border-radius: var(--radius-panel); overflow: hidden; pointer-events: none; }
.ocb-root .ocb-card-clip::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--attr); }
.ocb-root .ocb-card-clip::after { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 5px; background: var(--attr); }
.ocb-root .ocb-card-edge { position: absolute; inset: 0; border: var(--stroke-frame) solid var(--attr); border-radius: var(--radius-panel); pointer-events: none; }
.ocb-root .ocb-card.is-lit .ocb-card-edge { border-color: var(--wick); }
.ocb-root .ocb-card.is-lit { box-shadow: var(--shadow-card), var(--shadow-lamp); }
.ocb-root .ocb-cost { position: absolute; left: 16px; top: 11px; width: 44px; height: 44px; border-radius: 50%; border: var(--stroke-frame) solid var(--amber); background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; font: 700 28px/1 var(--font-mono); color: var(--amber); }
.ocb-root .ocb-cost.is-down { background: var(--amber); color: var(--ground); }
.ocb-root .ocb-cost .ocb-down { position: absolute; left: 50%; transform: translateX(-50%); bottom: -9px; height: 18px; padding: 0 4px; border-radius: 3px; background: var(--panel-solid); border: 1px solid var(--amber); font: 400 14px/16px var(--font-body); color: var(--ink); white-space: nowrap; }
.ocb-root .ocb-attr-icon { position: absolute; left: 68px; top: 21px; }
.ocb-root .ocb-reach { position: absolute; right: 12px; top: 11px; height: 32px; padding: 0 8px; display: flex; align-items: center; gap: 4px; background: var(--panel-solid); border: 1px solid var(--steel); border-radius: var(--radius-tag); font: 700 20px/1 var(--font-mono); color: var(--ink); white-space: nowrap; }
.ocb-root .ocb-reach small { font: 400 14px/1 var(--font-body); }
.ocb-root .ocb-card-name { position: absolute; left: 16px; top: 60px; right: 12px; font: 700 22px/28px var(--font-display); letter-spacing: .02em; white-space: nowrap; }
.ocb-root .ocb-values { position: absolute; left: 16px; top: 94px; display: flex; gap: 14px; }
.ocb-root .ocb-val { display: grid; grid-template-columns: 24px auto; column-gap: 4px; align-items: center; }
.ocb-root .ocb-val b { font: 700 36px/40px var(--font-mono); color: var(--val-ink, var(--attr-ink)); }
.ocb-root .ocb-val small { grid-column: 2; font: 400 16px/18px var(--font-body); color: var(--ink-muted); margin-top: -2px; }
.ocb-root .ocb-desc { position: absolute; left: 16px; top: 156px; width: 188px; height: 66px; font: 400 16px/22px var(--font-body); color: var(--ink); line-break: strict; word-break: normal; overflow-wrap: anywhere; }
.ocb-root .ocb-card.is-stance .ocb-desc { top: 94px; height: 88px; }
.ocb-root .ocb-desc .ocb-inf { display: flex; gap: 6px; align-items: center; height: 22px; white-space: nowrap; }
.ocb-root .ocb-desc.fit-unity { white-space: nowrap; overflow: visible; }
.ocb-root .ocb-desc.fit-clip { overflow: hidden; }
.ocb-root .ocb-desc .ocb-more { color: var(--ink-muted); }
.ocb-root .ocb-trait { position: absolute; left: 12px; right: 7px; bottom: 7px; height: 62px; background: rgba(0,0,0,.34); border: 1px solid var(--rule); border-radius: var(--radius-tag); display: flex; align-items: center; padding: 0 4px 0 0; }
.ocb-root .ocb-trait.is-plain { border-style: dashed; border-color: var(--steel); color: var(--ink-muted); padding-left: 12px; }
.ocb-root .ocb-trait .ocb-lamp-slot { width: 26px; display: flex; justify-content: center; flex: none; }
.ocb-root .ocb-trait p { font: 400 16px/22px var(--font-body); white-space: nowrap; }
.ocb-root .ocb-trait p + p { font-weight: 700; }
.ocb-root .ocb-lamp { width: 10px; height: 10px; border-radius: 50%; background: var(--steel); }
.ocb-root .ocb-lamp.is-on { width: 16px; height: 16px; background: var(--wick); box-shadow: 0 0 10px rgba(255,216,154,.8); }
.ocb-root .ocb-card-dim { position: absolute; inset: 0; border-radius: var(--radius-panel); background: #000; opacity: 0; pointer-events: none; }
.ocb-root .ocb-card.is-unpayable .ocb-card-dim { opacity: var(--opacity-unpayable); }
.ocb-root .ocb-term { text-decoration: underline dotted var(--ink-muted) 2px; text-underline-offset: 4px; }

/* ---------- omen plate (200×98) ---------- */
.ocb-root .ocb-omen { position: relative; width: 200px; height: 98px; background: var(--panel-solid); border: var(--stroke-frame) solid var(--violet); border-radius: var(--radius-panel); padding: 8px 12px; display: flex; flex-direction: column; justify-content: space-between; transition: box-shadow .12s; }
.ocb-root .ocb-omen.is-active { border-color: var(--phosphor); box-shadow: var(--shadow-omen-active); }
.ocb-root .ocb-omen.is-rest { border: var(--stroke-frame) dashed var(--steel); }
.ocb-root .ocb-omen-row1 { display: flex; align-items: center; gap: 8px; height: 52px; }
.ocb-root .ocb-omen-row1 b { font: 700 48px/52px var(--font-mono); }
.ocb-root .ocb-omen-row1 .ocb-swatch { margin-left: auto; }
.ocb-root .ocb-omen-row2 { display: flex; align-items: center; justify-content: space-between; height: 26px; font: 400 16px/22px var(--font-body); }
.ocb-root .ocb-hitmark { width: 30px; height: 26px; display: flex; align-items: center; justify-content: center; border-radius: 4px; position: relative; }
.ocb-root .ocb-hitmark.is-hit { border: 2px solid var(--phosphor); }
.ocb-root .ocb-hitmark.is-miss { border: 2px dashed var(--miss); }
.ocb-root .ocb-hitmark.is-miss::after { content: ""; position: absolute; left: 2px; right: 2px; top: 50%; height: 2px; background: var(--miss); transform: rotate(-24deg); }
.ocb-root .ocb-omen-reserve { width: 170px; height: 66px; opacity: .62; border: var(--stroke-frame) dashed var(--ink-muted); background: var(--panel-solid); border-radius: var(--radius-panel); padding: 6px 10px; display: flex; align-items: center; gap: 8px; position: relative; }
.ocb-root .ocb-omen-reserve b { font: 700 28px/1 var(--font-mono); }
.ocb-root .ocb-omen-reserve .ocb-plan { position: absolute; right: 6px; bottom: 6px; font: 400 14px/16px var(--font-body); border: 1px dashed var(--ink-muted); border-radius: 3px; padding: 0 4px; }

/* ---------- floor ---------- */
.ocb-root .ocb-tile { position: absolute; height: 40px; border-radius: var(--radius-panel); background: var(--floor-tile); border: var(--stroke-rule) solid var(--rule); }
.ocb-root .ocb-tile-reach { position: absolute; inset: 0; border-radius: var(--radius-panel); background: linear-gradient(rgba(232,168,76,.55), rgba(232,168,76,.18)); box-shadow: var(--shadow-reach); opacity: 0; }
.ocb-root .ocb-tile-reach-line { position: absolute; left: 0; right: 0; top: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--amber); opacity: 0; }
.ocb-root .ocb-tile-threat { position: absolute; inset: -1px; border-radius: var(--radius-panel); border: var(--stroke-frame) solid var(--reach-red); box-shadow: var(--shadow-threat); overflow: hidden; }
.ocb-root .ocb-tile-threat svg { position: absolute; inset: 0; }
.ocb-root .ocb-tile-move { position: absolute; inset: -1px; border-radius: var(--radius-panel); border: var(--stroke-frame) dashed var(--violet); }
.ocb-root .ocb-dist { position: absolute; height: 34px; display: flex; align-items: center; justify-content: center; }
.ocb-root .ocb-dist-chip { position: relative; z-index: 1; height: 34px; padding: 0 10px; display: flex; align-items: center; gap: 6px; background: var(--panel-solid); border: 1px solid var(--steel); border-radius: var(--radius-panel); font: 700 28px/1 var(--font-mono); }
.ocb-root .ocb-dist-arm { position: absolute; top: 50%; height: 12px; margin-top: -6px; border: 1px solid rgba(236,235,242,.55); border-right: 0; border-left-width: 1px; }

/* ---------- figures ---------- */
.ocb-root .ocb-figure { position: absolute; }
.ocb-root .ocb-footlight { position: absolute; height: 60px; border-radius: 50%; }

/* ---------- status panel ---------- */
.ocb-root .ocb-stat { position: relative; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.ocb-root .ocb-stat.is-elite { border-color: var(--phosphor); }
.ocb-root .ocb-hp { display: flex; align-items: center; gap: 6px; height: 28px; }
.ocb-root .ocb-hp b { font: 700 24px/28px var(--font-mono); min-width: 40px; text-align: right; }
.ocb-root .ocb-bar { position: relative; flex: 1; height: 14px; border-radius: 3px; background: rgba(0,0,0,.5); border: 1px solid var(--rule); overflow: hidden; }
.ocb-root .ocb-bar-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--crimson); transition: width .3s ease-out; }
.ocb-root .ocb-bar-loss { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--wick) 0 2px, transparent 2px 5px); }
.ocb-root .ocb-bar-ticks { position: absolute; inset: 0; }
.ocb-root .ocb-bar-ticks i { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(0,0,0,.55); }
.ocb-root .ocb-guardrow { display: flex; align-items: center; gap: 6px; height: 30px; }
.ocb-root .ocb-guardrow b { font: 700 24px/28px var(--font-mono); color: var(--guard); }
.ocb-root .ocb-guardrow.is-zero { opacity: var(--opacity-guard-zero); }
.ocb-root .ocb-guardrow.is-zero b { color: var(--ink-muted); }
.ocb-root .ocb-foe-st { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.ocb-root .ocb-foe-st b { color: var(--ink); }
.ocb-root .ocb-chips { display: flex; flex-wrap: wrap; gap: 5px; min-height: 0; }
.ocb-root .ocb-chips:empty { display: none; }

/* ---------- status chip + tooltip ---------- */
.ocb-root .ocb-chip { height: 30px; padding: 0 8px 0 6px; display: inline-flex; align-items: center; gap: 4px; background: rgba(0,0,0,.35); border: 1px solid var(--ink-muted); border-radius: var(--radius-chip-foe); font: 400 16px/1 var(--font-body); white-space: nowrap; cursor: default; }
.ocb-root .ocb-chip.is-self { border-color: var(--steel); border-radius: var(--radius-chip-self); }
.ocb-root .ocb-chip.is-boss { border: 3px double var(--boss); }
.ocb-root .ocb-chip:hover, .ocb-root .ocb-chip.is-hover { border-color: var(--ink); background: rgba(255,255,255,.1); }
.ocb-root .ocb-chip .ocb-mono { font-weight: 600; }
.ocb-root .ocb-tip { width: 340px; padding: 10px 12px 12px; background: var(--panel-solid); border: 1px solid var(--steel); border-radius: var(--radius-panel); box-shadow: var(--shadow-tip); }
.ocb-root .ocb-tip-head { display: flex; align-items: center; gap: 6px; font: 700 18px/24px var(--font-body); margin-bottom: 6px; }
.ocb-root .ocb-tip-head small { margin-left: auto; font: 400 14px/18px var(--font-body); color: var(--ink-muted); }
.ocb-root .ocb-tip p { font: 400 16px/22px var(--font-body); }
.ocb-root .ocb-tip p span { color: var(--ink-muted); margin-right: 8px; }

/* ---------- stance slot (250×52) ---------- */
.ocb-root .ocb-stance { position: relative; width: 250px; height: 52px; padding: 0 12px; display: flex; align-items: center; gap: 8px; background: var(--panel); border: var(--stroke-frame) solid var(--hp-text); border-radius: var(--radius-panel); font: 700 20px/26px var(--font-display); }
.ocb-root .ocb-stance.is-foe { border-color: var(--violet); }
.ocb-root .ocb-stance.is-empty { background: none; border: var(--stroke-frame) dashed var(--steel); }
.ocb-root .ocb-stance .ocb-x { margin-left: auto; width: 40px; text-align: right; font: 600 16px/1 var(--font-mono); }
.ocb-root .ocb-stance.is-hover { background: rgba(40,44,58,.92); }

/* ---------- stamina plate + piles ---------- */
.ocb-root .ocb-stamina { position: relative; width: 236px; height: 84px; padding: 10px 12px; background: var(--card); border: 1px solid var(--steel); border-radius: var(--radius-plate); }
.ocb-root .ocb-st-row1 { display: flex; align-items: center; gap: 8px; height: 36px; }
.ocb-root .ocb-st-row1 b { font: 700 34px/36px var(--font-mono); color: var(--amber); }
.ocb-root .ocb-st-pay { margin-left: auto; font: 700 24px/1 var(--font-mono); color: var(--wick); opacity: 0; }
.ocb-root .ocb-st-pay.is-on { opacity: 1; }
.ocb-root .ocb-pips { display: flex; align-items: center; gap: 4px; height: 20px; margin-top: 8px; }
.ocb-root .ocb-pip { width: 16px; height: 16px; border-radius: 50%; flex: none; }
.ocb-root .ocb-pip.is-have { background: var(--amber); }
.ocb-root .ocb-pip.is-pay { border: 3px solid var(--amber); }
.ocb-root .ocb-pip.is-next { border: 2px dashed var(--amber); }
.ocb-root .ocb-pip.is-empty { border: 2px solid var(--steel); }
.ocb-root .ocb-pip.is-lit { animation: ocb-pip-lit .32s ease-out; }
@keyframes ocb-pip-lit { 0% { box-shadow: 0 0 0 0 rgba(255,216,154,.9); transform: scale(1.35); } 100% { box-shadow: 0 0 0 8px rgba(255,216,154,0); transform: scale(1); } }
.ocb-root .ocb-pip-div { width: 2px; height: 20px; background: rgba(236,235,242,.7); flex: none; }
.ocb-root .ocb-pile { position: relative; width: 64px; height: 84px; cursor: pointer; }
.ocb-root .ocb-pile-sheet { position: absolute; left: 0; width: 64px; height: 84px; border-radius: 5px; background: var(--card); border: 1px solid var(--steel); }
.ocb-root .ocb-pile-face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 5px; background: var(--card); border: 1px solid var(--steel); }
.ocb-root .ocb-pile.is-empty .ocb-pile-face { background: none; border-style: dashed; }
.ocb-root .ocb-pile:hover .ocb-pile-face { border-color: var(--ink); }

/* ---------- target frame + prediction + throw line ---------- */
.ocb-root .ocb-frame { position: absolute; pointer-events: none; }
.ocb-root .ocb-frame svg { position: absolute; inset: 0; overflow: visible; }
.ocb-root .ocb-pred { position: absolute; height: 60px; padding: 0 14px; display: flex; align-items: center; gap: 8px; background: var(--panel-solid); border: var(--stroke-frame) solid var(--wick); border-radius: var(--radius-panel); font: 700 48px/1 var(--font-mono); color: var(--wick); white-space: nowrap; transform: translate(-50%, -50%); }
.ocb-root .ocb-throwline { position: absolute; height: 3px; background: repeating-linear-gradient(90deg, var(--amber) 0 9px, transparent 9px 15px); filter: drop-shadow(0 0 0 var(--keyline)); }

/* ---------- notices ---------- */
.ocb-root .ocb-hoverline { width: 420px; min-height: 48px; padding: 10px 14px; display: flex; align-items: center; gap: 10px; background: var(--panel-solid); border: 1px solid var(--steel); border-radius: var(--radius-panel); font: 400 18px/26px var(--font-body); }
.ocb-root .ocb-reachpanel { width: 280px; height: 76px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; background: var(--panel-solid); border: 1px dashed var(--miss); border-radius: var(--radius-panel); font: 400 18px/26px var(--font-body); }
.ocb-root .ocb-refusal { height: 48px; padding: 0 20px 0 16px; display: inline-flex; align-items: center; gap: 12px; background: var(--panel-solid); border: 1px solid var(--steel); border-radius: var(--radius-panel); font: 400 20px/28px var(--font-body); white-space: nowrap; }
.ocb-root .ocb-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--amber); flex: none; }
.ocb-root .ocb-banner { position: absolute; left: 0; right: 0; height: 132px; display: flex; align-items: center; justify-content: center; background: linear-gradient(90deg, rgba(10,12,18,0), rgba(10,12,18,.8) 28%, rgba(10,12,18,.8) 72%, rgba(10,12,18,0)); font: 800 64px/72px var(--font-display); letter-spacing: .12em; pointer-events: none; }
.ocb-root .ocb-banner::before, .ocb-root .ocb-banner::after { content: ""; position: absolute; left: 22%; right: 22%; height: 2px; background: var(--banner-line, var(--amber)); opacity: .7; }
.ocb-root .ocb-banner::before { top: 10px; } .ocb-root .ocb-banner::after { bottom: 10px; }

// Export: JSON + a Markdown table (名前 / 今の値 / 単位 / Unity の元の値 / 変えたか)

  FEEL_DEFS.forEach(function (d) {

    json.feel[d[1]] = v; if (ch) json.changed.push(d[1]);
    md.push('| ' + d[0] + '・' + d[2] + '（' + d[1] + '） | ' + v + ' | ' + (d[3] || '—') + ' | ' + d[8] + ' | ' + (ch ? '● 変えた' : '') + ' |');
  });
  var smd = ['', '| 出来事 | 仕様の音 | 役 | 音色 | 音量 | 高さ（Hz） | 長さ（ms） | 明るさ | 変えたか |', '| --- | --- | --- | --- | --- | --- | --- | --- | --- |'];
  Object.keys(SOUND_DEFAULTS).forEach(function (k) {
    var p = sound.presets[k], d = SOUND_DEFAULTS[k];
    json.sound[k] = { timbre: p.timbre, vol: p.vol, pitch: p.pitch, dur: p.dur, tone: p.tone };
    var ch = p.timbre !== d.timbre || p.vol !== d.vol || p.pitch !== d.pitch || p.dur !== d.dur || p.tone !== d.tone;
    smd.push('| ' + d.label + '（' + k + '） | ' + d.spec + ' | ' + d.role + ' | ' + TIMBRES[p.timbre] + ' | ' + p.vol + ' | ' + p.pitch + ' | ' + p.dur + ' | ' + p.tone + ' | ' + (ch ? '● 変えた' : '') + ' |');
  });
  json.sound._master = sound.master; json.sound._reverb = sound.reverb; json.sound._muted = sound.muted;
  return { json: JSON.stringify(json, null, 2), md: md.join('\n') + '\n' + smd.join('\n') };
}

function FloorLane(d) {
  var cells = d.cells || 6, cw = 1320 / cells;
  var host = h('div', { style: 'position:absolute;left:0;top:0;width:1920px;height:640px' });
  for (var i = 0; i < cells; i++) {
    var t = FloorTile(cw - 6); place(t, 300 + i * cw + 3, 560);
    var th = (d.threat || []).filter(function (x) { return x.cell === i; });
    t.setThreat(th, d.move === i);
    if ((d.reach || []).indexOf(i) >= 0) { t.reach.style.opacity = 1; t.reachLine.style.opacity = 1; }
    host.appendChild(t);
  }
  if (d.player != null && d.enemy != null) {
    var a = Math.min(d.player, d.enemy), b = Math.max(d.player, d.enemy), gap = b - a - 1;
    var chip = DistanceChip(gap, gap * cw); place(chip, gap > 0 ? 300 + (a + 1) * cw : 300 + b * cw - 50, 563); host.appendChild(chip);
  }
  [['swordsman', d.player], ['spearman', d.enemy]].forEach(function (q) {
    if (q[1] == null) return;
    var f = FIGURES[q[0]], x = 300 + cw * (q[1] + 0.5);
    var fl = FootLight(f.body * 2, f.side === 'foe'); place(fl, x - f.body, 540); host.appendChild(fl);
    host.appendChild(place(h('div', null, Figure(q[0])), x - f.cx, 570 - f.h));
  });
  return host;
}
OCB.FloorLane = FloorLane;

// Small notices in one call: kind = 'hover' | 'reach' | 'refusal' | 'banner' | 'float'
function Notices(kind, a, b, c) {
  if (kind === 'hover') return HoverLine(a, b);
  if (kind === 'reach') return ReachPanel(a);
  if (kind === 'refusal') return RefusalLine(a);
  if (kind === 'banner') return Banner(a, b);
  return FloatNum(a, b, c);
}
OCB.Notices = Notices;

// The HUD pieces around the edges, placed at their battle-visual §4 coordinates on a 1920×1080 host.
function TurnControls(d) {
  d = d || {};
  var host = h('div', { style: 'position:absolute;left:0;top:0;width:1920px;height:1080px' });
  host.appendChild(place(CornerInfo({ turn: d.turn || 3, floor: d.floor || 1, miasma: d.miasma || 12 }), 24, 20));
  host.appendChild(place(SpeedToggle(d.speed || 1.25), 1708, 20));
  host.appendChild(place(JournalButton(), 1840, 20));
  host.appendChild(place(PlayedAttrs(d.played || { attack: 2, defense: 1 }), 1718, 896));
  if (d.guard !== false) host.appendChild(place(GuardPreview(3), 1560, 984));
  host.appendChild(place(EndTurnButton(!!d.enemyTurn), 1672, 976));
  return host;
}
OCB.TurnControls = TurnControls;

// Sound palette: one button per event, playing the default preset.
function SoundPalette() {
  var snd = Sound();
  var wrap = h('div', { 'class': 'ocb-root ocb-lab', style: 'padding:12px' });
  wrap.appendChild(h('p', { 'class': 'ocb-note', style: 'margin:0 0 10px' }, '押すと鳴ります（WebAudio で作った音。音声ファイルは使いません）。1 回の行動は「動作 → 結果」の 2 音までです。'));
  var grid = h('div', { 'class': 'ocb-grid', style: 'grid-template-columns:repeat(auto-fill,minmax(220px,1fr))' });
  Object.keys(SOUND_DEFAULTS).forEach(function (k) {
    var d = SOUND_DEFAULTS[k];
    var b = h('button', { 'class': 'ocb-lbtn', type: 'button', style: 'text-align:left;white-space:normal' }, '▶ ' + d.label, h('br'), h('small', { style: 'color:var(--ink-muted)' }, TIMBRES[d.timbre] + ' ・ 仕様: ' + d.spec));
    b.addEventListener('click', function () { snd.unlock(); snd.play(k); });
    grid.appendChild(b);
  });
  wrap.appendChild(grid);
  return wrap;
}
OCB.SoundPalette = SoundPalette;

OCB.version = '1.0.0';
window.OCB = OCB;
})();

</script>
<script>window.G = OCB.mountBattle(document.getElementById('game'));</script>
