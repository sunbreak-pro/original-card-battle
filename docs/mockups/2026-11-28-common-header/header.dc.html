<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>共通ヘッダー 探索の帯をそのまま整える</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer;color:#ecebf2}
svg.i{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* the sheet: a caption, then the top 300 px of one screen */
.cap{height:52px;display:flex;align-items:center;gap:16px;padding:0 24px;font-size:22px;font-weight:700}
.cap small{font-size:18px;font-weight:400;color:#a9adbd}
.scr{position:relative;width:1920px;height:300px;overflow:hidden}
/* the header: one band, the same on every screen. Where, the days left, HP and stamina are packed to the left as numbers only; the buttons stay on the right */
.band{position:absolute;left:0;top:0;width:1920px;height:96px;box-sizing:border-box;padding:0 24px;display:flex;align-items:center;gap:28px;background:rgba(16,20,30,.88);border-bottom:1px solid rgba(157,166,186,.26);box-shadow:0 6px 18px rgba(16,20,29,.6)}
.loc{flex:none;display:flex;align-items:center;gap:12px}
.loc .t{font:700 28px/36px 'Shippori Mincho',serif;letter-spacing:.04em;white-space:nowrap}
.tag{font-size:16px;font-weight:700;line-height:26px;padding:0 10px;border:1px solid #6d7787;border-radius:4px;white-space:nowrap}
.dv{flex:none;width:1px;height:40px;background:rgba(157,166,186,.26)}
.st{flex:none;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;white-space:nowrap}
.st b{font:700 24px 'IBM Plex Mono',monospace}
.st.cal b{font:700 32px/32px 'IBM Plex Mono',monospace;margin:0 4px}
.st .p{width:20px;height:20px;border-radius:50%;background:#e8a84c}
.btns{margin-left:auto;display:flex;align-items:center;gap:8px}
.bb{position:relative;height:72px;min-width:76px;box-sizing:border-box;padding:6px 12px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#141925;border:1px solid #6d7787;border-radius:6px;font-size:16px;line-height:20px;white-space:nowrap}
.bb.on{border:2px solid #ffd89a;background:#1d2433}
.cnt{position:absolute;right:-6px;top:-8px;min-width:30px;height:24px;box-sizing:border-box;padding:0 6px;display:flex;align-items:center;justify-content:center;background:#e8a84c;color:#10141d;border-radius:12px;font:700 16px 'IBM Plex Mono',monospace}
.sep{width:1px;height:48px;background:rgba(157,166,186,.4);margin:0 8px}
</style>
</helmet>
<div style="width: 1920px; height: 1544px; box-sizing: border-box; padding: 32px 0; display: flex; flex-direction: column; gap: 24px; background: #07090d; font-family: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif; color: #ecebf2;">

  <!-- 1. the base -->
  <div>
    <div class="cap">拠点（降り口の前）<small>暦・HP・スタミナは棒をやめて数値だけにし、現在地のすぐ右へ詰めます。</small></div>
    <div class="scr" style="background: linear-gradient(180deg, #1a1d27, #12151e);">
      <div aria-hidden="true" style="position: absolute; left: 700px; top: 150px; width: 520px; height: 260px; border-radius: 260px 260px 0 0; background: linear-gradient(180deg, #fafde0, #c4e878); box-shadow: 0 0 0 14px #262a36, 0 0 0 16px #6d7787, 0 0 120px rgba(196,232,120,.35);"></div>
      <div class="band">
        <div class="loc"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-9a7 7 0 0 1 14 0v9M3 20h18"/></svg><span class="t">拠点</span></div>
        <span class="dv"></span>
        <div class="st cal"><svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10M7 20h10M8 4c0 4 4 5 4 8s-4 4-4 8M16 4c0 4-4 5-4 8s4 4 4 8"/></svg><span>残り<b>87</b>日</span></div>
        <div class="st"><svg width="22" height="22" viewBox="0 0 24 24" fill="#c2483f" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span><b>50</b> / 50</span></div>
        <div class="st"><span class="p"></span><span><b>10</b> / 10</span></div>
        <div class="btns">
          <button class="bb"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="4" width="11" height="15" rx="1.6"/><path d="M5 8v11a1.6 1.6 0 0 0 1.6 1.6H14"/></svg>所持カード<span class="cnt">20</span></button>
          <button class="bb"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1zM12 6v13"/></svg>手記</button>
          <button class="bb"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>設定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. the table where the deck is made ready -->
  <div>
    <div class="cap">支度の卓<small>札を組む画面なので、所持カードのボタンが点いたままになります。</small></div>
    <div class="scr" style="background: linear-gradient(180deg, #221c15, #16120d);">
      <div aria-hidden="true" style="position: absolute; left: 420px; top: 150px; display: flex; gap: 20px;">
        <div style="width: 160px; height: 220px; background: #171c28; border: 1px solid #6d7787; border-radius: 6px;"></div>
        <div style="width: 160px; height: 220px; background: #171c28; border: 1px solid #6d7787; border-radius: 6px;"></div>
        <div style="width: 160px; height: 220px; background: #171c28; border: 1px solid #6d7787; border-radius: 6px;"></div>
        <div style="width: 160px; height: 220px; background: #171c28; border: 1px solid #6d7787; border-radius: 6px;"></div>
        <div style="width: 160px; height: 220px; background: #171c28; border: 1px solid #6d7787; border-radius: 6px;"></div>
        <div style="width: 160px; height: 220px; background: #171c28; border: 1px solid #6d7787; border-radius: 6px;"></div>
      </div>
      <div class="band">
        <div class="loc"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-9a7 7 0 0 1 14 0v9M3 20h18"/></svg><span class="t">拠点</span><span class="tag">支度の卓</span></div>
        <span class="dv"></span>
        <div class="st cal"><svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10M7 20h10M8 4c0 4 4 5 4 8s-4 4-4 8M16 4c0 4-4 5-4 8s4 4 4 8"/></svg><span>残り<b>87</b>日</span></div>
        <div class="st"><svg width="22" height="22" viewBox="0 0 24 24" fill="#c2483f" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span><b>50</b> / 50</span></div>
        <div class="st"><span class="p"></span><span><b>10</b> / 10</span></div>
        <div class="btns">
          <button class="bb on"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="4" width="11" height="15" rx="1.6"/><path d="M5 8v11a1.6 1.6 0 0 0 1.6 1.6H14"/></svg>所持カード<span class="cnt">20</span></button>
          <button class="bb"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1zM12 6v13"/></svg>手記</button>
          <button class="bb"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>設定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. the map -->
  <div>
    <div class="cap">探索の地図<small>今の帯から、暦と HP の棒・訓練の刻みを外しました。右の 3 つのボタンは今のままです。</small></div>
    <div class="scr" style="background: linear-gradient(180deg, #15281a, #0f1d13);">
      <svg aria-hidden="true" width="1920" height="300" viewBox="0 0 1920 300" style="position: absolute; left: 0; top: 0;" fill="none" stroke-linecap="round">
        <path d="M0 268c220-26 380 22 620 4s420-30 720-6 380 10 580-4" stroke="rgba(236,235,242,.07)" stroke-width="2"/>
        <path d="M860 96h200l-30 46H890z" fill="#fafde0"/>
        <path d="M960 190c-90 30-170 50-250 84M960 190c90 30 180 52 260 84" stroke="#c4e878" stroke-width="22"/>
        <ellipse cx="960" cy="186" rx="74" ry="38" fill="#0a140d" stroke="#e8a84c" stroke-width="3"/>
      </svg>
      <div class="band">
        <div class="loc"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4v-4h4v-4h4V8h4"/></svg><span class="t">第 1 層　燦光の樹海</span></div>
        <span class="dv"></span>
        <div class="st cal"><svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10M7 20h10M8 4c0 4 4 5 4 8s-4 4-4 8M16 4c0 4-4 5-4 8s4 4 4 8"/></svg><span>残り<b>86</b>日</span></div>
        <div class="st"><svg width="22" height="22" viewBox="0 0 24 24" fill="#c2483f" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span><b>38</b> / 50</span></div>
        <div class="st"><span class="p"></span><span><b>8</b> / 10</span></div>
        <div class="btns">
          <button class="bb"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="4" width="11" height="15" rx="1.6"/><path d="M5 8v11a1.6 1.6 0 0 0 1.6 1.6H14"/></svg>所持カード<span class="cnt">20</span></button>
          <button class="bb"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1zM12 6v13"/></svg>手記</button>
          <button class="bb"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>設定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. the battle -->
  <div>
    <div class="cap">戦闘<small>現在地の横にターンの札を添えます。速さは、右のボタンの並びの左端です。</small></div>
    <div class="scr" style="background: linear-gradient(180deg, #1d3340, #182b37);">
      <div aria-hidden="true" style="position: absolute; left: 1180px; top: 130px; width: 220px; height: 220px; border-radius: 50%; background: rgba(255,255,255,.08);"></div>
      <div aria-hidden="true" style="position: absolute; left: 520px; top: 210px; width: 110px; height: 140px; border-radius: 55px 55px 0 0; background: #2b2f3a; border: 2px solid rgba(232,168,76,.6);"></div>
      <div aria-hidden="true" style="position: absolute; left: 1240px; top: 180px; width: 150px; height: 170px; border-radius: 75px 75px 0 0; background: #1b1722; border: 2px solid rgba(139,111,208,.7);"></div>
      <div class="band">
        <div class="loc"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4v-4h4v-4h4V8h4"/></svg><span class="t">第 1 層　燦光の樹海</span><span class="tag">ターン 3</span></div>
        <span class="dv"></span>
        <div class="st cal"><svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10M7 20h10M8 4c0 4 4 5 4 8s-4 4-4 8M16 4c0 4-4 5-4 8s4 4 4 8"/></svg><span>残り<b>86</b>日</span></div>
        <div class="st"><svg width="22" height="22" viewBox="0 0 24 24" fill="#c2483f" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg><span><b>31</b> / 50</span></div>
        <div class="st"><span class="p"></span><span><b>5</b> / 10</span></div>
        <div class="btns">
          <button class="bb"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6l6 6-6 6M13 6l6 6-6 6"/></svg>速さ ×1</button>
          <span class="sep"></span>
          <button class="bb"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="4" width="11" height="15" rx="1.6"/><path d="M5 8v11a1.6 1.6 0 0 0 1.6 1.6H14"/></svg>所持カード<span class="cnt">20</span></button>
          <button class="bb"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v13c-3-1-6-1-8 1-2-2-5-2-8-1zM12 6v13"/></svg>手記</button>
          <button class="bb"><svg class="i" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>設定</button>
        </div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1544}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
