name: Human Task
description: Claude が代われない人手の作業（実機の手触り / 絵の選定 / 課金・認証）
labels: ["type:human"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: 優先順位
      description: "着手の順番。sev:（影響の大きさ）とは別の軸。選んだ値が prio: ラベルになる"
      options:
        - "prio:1 最優先。いま着手する"
        - "prio:2 次に着手する"
        - "prio:3 その後（設計や判断は並行可）"
        - "prio:4 いつか。着手時に見直す"
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: やること, description: 画面の名前とボタン名まで書く }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: なぜ Claude が代われないか }
  - type: textarea
    id: handback
    attributes: { label: 終わったら Claude に何を渡すか, description: 画像 / 所感 / 数値 }
