name: Known Issue
description: バグ / 構造的問題の記録
labels: ["type:bug"]
body:
  - type: dropdown
    id: priority
    attributes:
      label: 優先順位
      description: "着手の順番。sev:（影響の大きさ）とは別の軸。選んだ値が prio: ラベルになる"
      options:
        - "prio:1 最優先。いま着手する"
        - "prio:2 次に着手する"
        - "prio:3 その後（設計や判断は並行可）"
        - "prio:4 いつか。着手時に見直す"
    validations: { required: true }
  - type: input
    id: discovered
    attributes: { label: Discovered (YYYY-MM-DD) }
  - type: textarea
    id: symptom
    attributes: { label: Symptom, description: 症状。エラーは原文引用 }
    validations: { required: true }
  - type: textarea
    id: root_cause
    attributes: { label: Root Cause, description: 原因の本質（file:line） }
  - type: textarea
    id: impact
    attributes: { label: Impact }
  - type: textarea
    id: fix
    attributes: { label: Fix / Workaround }
  - type: textarea
    id: references
    attributes: { label: References }
  - type: textarea
    id: lessons
    attributes: { label: Lessons Learned }
